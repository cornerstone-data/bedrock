# Cornerstone 2025 model — v0.5 release config.
#
# The v0.4 configuration on the v0.5 nowcast build:
#   - Detail MUT from the NowcastMUT after-redefinition build named by
#     nowcast_mut_vintage: v0.3.0_fa85e78, the Steps 3-7 rebuild of the frozen
#     v0.5 main (fa85e780, 2026-09-28). All eight years balance (T11 0.0 $M).
#     It carries the gross output and theta stack (#1014, #1016, #1018), the
#     residential electricity constraint (#1011), the Step 5 closers (#950),
#     the scrap price path (#1026) and the census materials switch at 1.0 (#1020).
#                                        -> usa_detail_io_source: nowcast, usa_base_io_data_year: 2024
#   - Everything else as v0.4: UMD GHG + MECS on the nowcast Use, waste
#     disaggregation, industry-average margins, no IO year adjustments.
#
# ⚠️ The GHG FBS is NOT pinned here. use_cornerstone_ghg_model with a nowcast
# source loads the newest GCS parquet for GHG_national_Cornerstone_nowcast_2024.
# Until the v0.5 GHG FBS is built on this MUT (plan task T15, with the facility
# attribution of #965/#1023 and #1007's biogenic CH4), the newest is v0.4's
# v0.3.0_99655e9, attributed on the v0.4 Use table. The GHG FBS is inspected
# directly, so record the exact parquet (filename and sha256) T15 produces, here
# and in the release notes, before the v0.5 snapshot is cut.
#
# nowcast_mut_vintage pins one GCS build so the snapshot cut from this config is
# reproducible even after newer nowcast builds are uploaded; move the pin only
# when a new build is accepted for release.

#####
# Model base settings
#####
model_base_year: 2024
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v0.3.0_fa85e78'
usa_base_io_data_year: 2024
usa_ghg_data_year: 2024

#####
# Methodology selection
#####
use_cornerstone_ghg_model: True
apply_io_year_adjustments: False
implement_waste_disaggregation: True
cornerstone_industry_avg_margins: True
