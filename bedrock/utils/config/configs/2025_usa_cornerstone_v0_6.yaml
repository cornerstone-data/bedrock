# Cornerstone 2025 model - v0.6.
#
# 2024 nowcast model. Detail MUT is the after-redefinition build named by
# nowcast_mut_vintage. Facility GHG attribution on the nowcast Use selects
# GHG_national_Cornerstone_nowcast_facilities_{year}. Waste disaggregation,
# industry-average margins, and no IO year adjustments.
#
# TODO: nowcast_mut_vintage v0.3.0_3096818 is a placeholder. The Make/Use
# tables for this config are the rebuild carried on bea_price_index_vintage
# 2026Q2; set the pin to that vintage when those after-redefinition artifacts
# are on GCS. Both dollar years are 2024, so loading the pinned MUT does not
# recompute Make or Use from the index.
#
# The GHG FBS is not pinned. use_cornerstone_ghg_model with nowcast and
# use_facility_ghg_attribution loads the newest GCS parquet for
# GHG_national_Cornerstone_nowcast_facilities_2024.

#####
# Model base settings
#####
model_base_year: 2024
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v0.3.0_3096818'
usa_base_io_data_year: 2024
usa_ghg_data_year: 2024
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
use_cornerstone_ghg_model: True
use_facility_ghg_attribution: True
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
