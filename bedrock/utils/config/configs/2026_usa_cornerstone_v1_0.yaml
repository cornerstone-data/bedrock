# Cornerstone 2026 model - v1.0.
#
# Unsuffixed family release for calendar year 2024. Same resolved fields as
# 2026_usa_cornerstone_v1_0_2024 (the series member). Detail MUT is the
# after-redefinition build named by nowcast_mut_vintage: v1.0.0_5514c3b, the
# 2017-2024 rebuild on the 2026 BEA annual update. bea_price_index_vintage
# 2026Q2 is the index those tables were built with. The GHG loader returns
# GHG_national_Cornerstone_2024. cornerstone_ghg_fbs_filename pins the
# retained-activity year-stem object
# GHG_national_Cornerstone_2024_v0.6.0_635777c.parquet.
# Waste disaggregation, industry-average margins, and no IO year adjustments.

#####
# Model base settings
#####
model_base_year: 2024
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v1.0.0_5514c3b'
usa_base_io_data_year: 2024
usa_ghg_data_year: 2024
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
cornerstone_ghg_fbs_filename: GHG_national_Cornerstone_2024_v0.6.0_635777c.parquet
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
