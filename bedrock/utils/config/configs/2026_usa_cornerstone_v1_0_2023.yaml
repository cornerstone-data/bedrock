# Cornerstone 2026 model - v1.0, calendar year 2023.
#
# Same methodology as 2025_usa_cornerstone_v0_6 for year 2023.
# nowcast_mut_vintage v0.5.0_a166975 is the 2026Q2 price-index rebuild.
# bea_price_index_vintage 2026Q2 is the index those tables were built with.
# The GHG loader returns GHG_national_Cornerstone_2023.
# cornerstone_ghg_fbs_filename pins the retained-activity year-stem object
# GHG_national_Cornerstone_2023_v0.6.0_635777c.parquet.
# Waste disaggregation, industry-average margins, and no IO year adjustments.

#####
# Model base settings
#####
model_base_year: 2023
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v0.5.0_a166975'
usa_base_io_data_year: 2023
usa_ghg_data_year: 2023
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
cornerstone_ghg_fbs_filename: GHG_national_Cornerstone_2023_v0.6.0_635777c.parquet
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
