# Cornerstone v0.4 nowcast model — calendar year 2017 (IO + GHG).
#
# Detail MUT from NowcastMUT after-redefinition artifacts, not published BEA
# detail. Methodology mirrors v0.3 full-model flags except IO year adjustments
# (forbidden when usa_detail_io_source is nowcast).
# x and q are row and column sums of that after-redef Make; B is not
# year-scaled or inflated.
#
# nowcast_mut_vintage is pinned to v0.5.0_011f41f, a clean 2017 rebuild on
# main. The 2017 tables at v0.5.0_a166975 (#1089) carry almost no compensation
# of employees: $18.7 bn against $10,435 bn, with all of value added in
# surplus. Unpinned, this config followed that upload. The other v0.4
# nowcast years still follow the most recent GCS Make upload; their
# a166975 tables are correct.

#####
# Model base settings
#####
model_base_year: 2017
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v0.5.0_011f41f'
usa_base_io_data_year: 2017
usa_ghg_data_year: 2017

#####
# Methodology selection
#####
use_cornerstone_ghg_model: True
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
