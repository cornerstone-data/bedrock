# Cornerstone 2026 model - v1.0, calendar year 2017.
#
# Same methodology as 2026_usa_cornerstone_v1_0 for year 2017.
# nowcast_mut_vintage v1.0.0_2b1164f is the 2017-2024 rebuild on the 2026 BEA
# annual update, with electric output on EIA's 2017 level and the 2026-11-10
# fixes below (#1249), the balance and export fixes of 11-12 (#1270, #1293)
# and the trade margin receivers (#1194).
# bea_price_index_vintage 2026Q2 is the index those tables were built with. The
# GHG loader returns GHG_national_Cornerstone_2017.
# cornerstone_ghg_fbs_filename names the GCS object loaded for E. When
# nowcast_mut_vintage or GHG inputs move, follow
# bedrock/utils/snapshots/README.md (Bump cascade / Phase A A2). Waste
# disaggregation, industry-average margins, and no IO year adjustments.

#####
# Model base settings
#####
model_base_year: 2017
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v1.0.0_2b1164f'
usa_base_io_data_year: 2017
usa_ghg_data_year: 2017
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
cornerstone_ghg_fbs_filename: GHG_national_Cornerstone_2017_v1.0.0_2b1164f.parquet
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
# Electric power on EIA retail revenue and the electricity accounting residual.
# nowcast_mut_vintage above was built with all five on.
electric_output_on_retail_revenue: True
electricity_accounting_residual: True
carry_power_petroleum_on_price: True
reprice_oil_gas_extraction_seed: True
hold_electric_gas_on_eia: True
# Electric output starts from EIA's 2017 level (the MUT above was built
# with it on), and delivery is its own sector with buyer-specific margins,
# applied after Step 7.
electric_output_on_eia_level: True
electricity_delivery_margin: True
# Rebuild flag set for the live v1.0 MUT (includes #1249 path plus #1303/#1305/#1306).
# AIES output chain (#1231): withheld codes, 325190 on BEA, gas distribution.
fill_withheld_aies_codes: True
hold_aies_outliers_on_bea: True
chain_gas_distribution_on_aies: True
# Truck and water margins chained across the AIES change (#1248).
chain_transport_margins_across_aies: True
# Each buyer's Step 6 margins capped at its purchase (#1257).
cap_margins_at_purchase: True
# Refinery co-product Supply cells held at the GO mix through GRAS (#1237).
pin_refinery_secondaries_at_go_mix: True
# Air freight revenue at the AIES level from 2023 (#1251, #1274).
air_margin_on_aies_level: True
# Spread each year's trade margin over the goods by their own supply, not by
# frozen 2017 shares (#1194, #1260).
trade_margin_receivers_follow_supply: True
# Hold AIES years of the services seed on the SAS 2022 index (#1304, #1306).
hold_services_seed_at_last_sas_year: True
# Hold Step 5 imports to BEA summary MCIF groups (#1288, #1303).
hold_imports_on_summary_groups: True
# Condition service F04000 on BEA summary Use (#1250, #1303).
condition_service_exports_on_summary: True
# Commercial kWh on survey electricity or other inputs, not bills (#899, #705, #1305).
# Delivery shares only (after Step 7); on with the live model.
commercial_kwh_follow_intermediate_inputs: True
