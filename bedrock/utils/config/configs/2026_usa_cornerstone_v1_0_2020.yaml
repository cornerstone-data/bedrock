# Cornerstone 2026 model - v1.0, calendar year 2020.
#
# Same methodology as 2025_usa_cornerstone_v0_6 for year 2020.
# nowcast_mut_vintage v1.0.0_c99157a is the 2017-2024 rebuild on the 2026 BEA
# annual update.
# bea_price_index_vintage 2026Q2 is the index those tables were built with.
# The GHG loader returns GHG_national_Cornerstone_2020.
# cornerstone_ghg_fbs_filename pins the retained-activity year-stem object
# GHG_national_Cornerstone_2020_v0.6.0_635777c.parquet.
# Waste disaggregation, industry-average margins, and no IO year adjustments.

#####
# Model base settings
#####
model_base_year: 2020
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v1.0.0_c99157a'
usa_base_io_data_year: 2020
usa_ghg_data_year: 2020
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
cornerstone_ghg_fbs_filename: GHG_national_Cornerstone_2020_v0.6.0_635777c.parquet
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
