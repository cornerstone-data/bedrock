# Cornerstone 2025 model - v0.5.9 transportation.
#
# v0.5.9 settings with transportation GHG allocation on.
# nowcast_mut_vintage is v0.5.0_a166975 and bea_price_index_vintage is
# 2026Q2, the index that Use was built with. use_transportation_ghg_allocation
# selects GHG_national_Cornerstone_nowcast_facilities_transportation_2024.
# cornerstone_ghg_fbs_filename pins that stem to
# GHG_national_Cornerstone_nowcast_facilities_transportation_2024_v0.5.0_011f41f.parquet.

#####
# Model base settings
#####
model_base_year: 2024
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v0.5.0_a166975'
usa_base_io_data_year: 2024
usa_ghg_data_year: 2024
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
use_cornerstone_ghg_model: True
use_facility_ghg_attribution: True
use_transportation_ghg_allocation: True
cornerstone_ghg_fbs_filename: GHG_national_Cornerstone_nowcast_facilities_transportation_2024_v0.5.0_011f41f.parquet
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
