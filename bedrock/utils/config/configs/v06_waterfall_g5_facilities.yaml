# v06_waterfall G5 — facilities. Settings match
# 2025_usa_cornerstone_v0_5_9: Use v0.5.0_a166975, price index 2026Q2,
# facility GHG on, and
# GHG_national_Cornerstone_nowcast_facilities_2024_v0.5.0_a166975.parquet.
# This rung does not use the transportation GHG FBS
# (GHG_national_Cornerstone_nowcast_facilities_transportation_2024_v0.5.0_82e24cd).
# 2025_usa_cornerstone_v0_6 pins that file. The loader still returns
# GHG_national_Cornerstone_2024.
#
# Relative to v06_waterfall_g4_nowcast this rung changes the Use pin, the
# price-index vintage, facility attribution, and the GHG FBS pin together.
# The facility-only step on the v0.5 Use is 2025_usa_cornerstone_v0_5.

#####
# Model base settings
#####
model_base_year: 2024
iot_before_or_after_redefinition: after

#####
# Data selection
#####
usa_detail_io_source: nowcast
nowcast_mut_vintage: 'v0.5.0_a166975'
usa_base_io_data_year: 2024
usa_ghg_data_year: 2024
bea_price_index_vintage: '2026Q2'

#####
# Methodology selection
#####
use_facility_ghg_attribution: True
cornerstone_ghg_fbs_filename: GHG_national_Cornerstone_nowcast_facilities_2024_v0.5.0_a166975.parquet
apply_io_year_adjustments: False
implement_waste_disaggregation: True
waste_weights_year: match_io
cornerstone_industry_avg_margins: True
