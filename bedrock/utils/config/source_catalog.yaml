  data_format: FBA
  class:
  - Money
  activity_schema:
    naics:
      year: 2017
      # the gross margin tables publish 4411 and 4413 but not 4412, so a
      # published parent does not always have its full set of children beneath it
      hierarchy: parent-incompleteChild
