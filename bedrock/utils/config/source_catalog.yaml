  data_format: FBA
  class:
  - Money
  activity_schema:
    naics:
      hierarchy: parent-completeChild
      by_year:
        2018: 2017
Census_ASM_PxI:
  data_format: FBA
  class:
  - Money
  # ActivityProducedBy is NAICS at 3 to 6 digits plus the '31-33' rollup, and
  # the rollups must survive - the least-suppressed level is chosen from them.
  #
  # ⚠️ This describes the FBA only. Once move_asm_product_to_activity runs, the
  # activity is a 10-digit NAPCS collection code and NOT NAICS, so any FBS
  # reading this source through that hook must set `activity_schema: null` in
  # its own source block. The catalog is merged AFTER the method config, so the
  # method's value loses to this one and the override has to be per-source.
  activity_schema:
    naics:
      year: 2017
      hierarchy: parent-completeChild
Census_AWTS:
  data_format: FBA
  class:
  - Money
  # the table's first column is labelled "2012 NAICS Code"; at the 3- and
  # 4-digit wholesale codes this method uses, 2012 and 2017 NAICS agree
  activity_schema:
    naics:
      year: 2012
      hierarchy: parent-completeChild
Census_SAS:
  data_format: FBA
  class:
  - Money
  # Activities are a mix of NAICS (Table 2, where the four pipeline margin items
  # live) and prose commodity-group names (Table 8, the truck allocator), so
  # neither schema covers the source. Both are joined to BEA 2017 detail on
  # Sector_Crosswalk_Census_SAS.csv instead - the same shape STB_CRSR uses.
  activity_schema: null
  sector_hierarchy: flat
