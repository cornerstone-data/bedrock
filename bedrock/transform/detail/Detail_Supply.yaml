# This method disaggregates a Summary Supply table for target use based on the
# 2017 Detail Supply table. The resulting tables do not reflect valid balanced
# Supply tables

# The full FBS for any year can be cached using:
# sources_to_cache:
#   Detail_Supply_2019:
#     !include:Detail_Supply.yaml
#     year: *year
#     source_names:
#       BEA_Summary_Supply:
#         !include:Detail_Supply.yaml:source_names:BEA_Summary_Supply
#         year: *year

# ⚠️ Targets BEA COMMODITY codes, not NAICS. Both Sector_Crosswalk_BEA_2017_*
# files map BEA -> NAICS, so naming them as activity_to_sector_mapping converts
# a BEA-coded table into NAICS and lands ~483 codes where 402 commodities were
# wanted. The sources are declared bea/2017 in source_catalog.yaml, so with a
# BEA default_schema they are sector-like and map to themselves - no crosswalk
# belongs in this method at all.
!include:BEA_detail_commodity_target.yaml
year: &summary_year 2018
geoscale: national

data_format: FBS

source_names:
  BEA_Summary_Supply:
    geoscale: national
    year: *summary_year
    primary_action_type: Consumed # speeds processing

    # Drop unneeded codes
    exclusion_fields:
      ActivityProducedBy: ['MADJ', 'MCIF', 'MDTY', 'SUB', 'T007', 'T013',
                           'T014', 'T015', 'T016', 'TOP', 'Trade', 'Trans']
      # ⚠️ 'Used' is NOT excluded: it is scrap (S00401), 10,761m in 2017 produced
      # as a by-product by 79 industries - GSLGO 4,118m, 562000 waste management
      # 829m - and dropping it silently loses a real commodity row from the
      # block. 'Other' (S00300 zero, S00900 3,468m from S00600 alone) is still
      # excluded; that is the same question and has not been decided.
      ActivityConsumedBy: ['Other', 'T017']
    attribution_method: proportional
    attribute_on: ['PrimarySector', 'SecondarySector']
    attribution_source:
      BEA_Detail_Supply:
        year: 2017
        primary_action_type: Consumed # speeds processing

        # Drop unneeded codes
        exclusion_fields:
          ActivityConsumedBy: ['T017', 'S00300', 'S00900']
          ActivityProducedBy: ['MADJ', 'MCIF', 'MDTY', 'SUB', 'T007', 'T013',
                               'T014', 'T015', 'T016', 'TOP', 'TRADE', 'TRANS']
        attribution_method: equal
