# National goods + services imports (CIF-family) mapped to BEA 2017 Detail.
#
# Everything except the year lives here; each source inherits `year` from the
# method config. Attribution weights stay on the 2017 Supply MCIF column.
# Per-year stubs: Trade_Imports_<year>.yaml.
!include:BEA_detail_commodity_target.yaml
target_schema_year: 2017
geoscale: national
activity_schema: null

_attribution_sources:
  supply_mcif: &supply_mcif
    year: 2017
    selection_fields:
      ActivityProducedBy: {'MCIF': ''}

source_names:
  Census_USATrade:
    geoscale: national
    data_format: FBA
    activity_to_sector_mapping: Census_USATrade
    # 336111/336112 are relabelled onto the parent 336110 in every year, so the
    # 1:m family - not Census's own child split - decides the vehicle split
    # (#702). Census's split disagrees with published MCIF by $111B on a pair
    # total that agrees to 0.4%, and Census drops the children at 2023, which
    # put an $80B discontinuity between 2022 and 2023.
    clean_fba_before_activity_sets: !clean_function:trade.utilities consolidate_vehicle_activities_fba
    activity_sets:
      goods_imports_cif:
        selection_fields:
          FlowName: GEN_CIF_YR
        attribution_method: proportional
        attribution_source:
          BEA_Detail_Supply:
            <<: *supply_mcif

  BEA_IEA:
    geoscale: national
    data_format: FBA
    activity_to_sector_mapping: BEA_IEA_imports
    activity_sets:
      service_imports:
        selection_fields:
          FlowName: Imports
        exclusion_fields:
          ActivityProducedBy: [AllTypesOfService]
        attribution_method: proportional
        attribution_source:
          BEA_Detail_Supply:
            <<: *supply_mcif

  # Physical electricity trade (#668): EIA Table 2.14 MWh × Census HS 2716
  # unit value. Import stubs inherit this source from the common body.
  EIA_ElectricPowerAnnual:
    geoscale: national
    data_format: FBA
    activity_to_sector_mapping: EIA_ElectricPowerAnnual
    clean_fba_before_activity_sets: !clean_function:trade.utilities dollarize_electricity_trade_fba
    activity_sets:
      electricity_imports:
        selection_fields:
          FlowName: electricity imports
        attribution_method: direct
