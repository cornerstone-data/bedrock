# National goods + services imports (CIF-family) mapped to BEA 2017 Detail.
#
# Everything except the year lives here; each source inherits `year` from the
# method config. Attribution weights stay on the 2017 Supply MCIF column.
# Per-year stubs: Trade_Imports_<year>.yaml.
!include:BEA_detail_commodity_target.yaml
target_schema_year: 2017
geoscale: national
activity_schema: null

_attribution_sources:
  supply_mcif: &supply_mcif
    year: 2017
    selection_fields:
      ActivityProducedBy: {'MCIF': ''}

source_names:
  Census_USATrade:
    geoscale: national
    data_format: FBA
    activity_to_sector_mapping: Census_USATrade
    # Every Census activity is relabelled onto its four-digit family parent, so
    # the 1:m family - not Census's own within-family split - decides where the
    # mass lands (#763, generalising #702's vehicle case). #702's evidence was
    # that Census's 336111/336112 split disagrees with published MCIF by $111B
    # on a pair total that agrees to 0.4%; #763 then measured the same defect
    # across 62 families and validated the fix on the 2012 holdout, where
    # published within-family import mixes drift by a median L1 of 0.04.
    #
    # ⚠️ duties.map_census_import_flow_to_detail applies the SAME consolidation.
    # The duty rate is a ratio of two mapped Census flows multiplying this
    # method's own mass; folding families on one side only would build the rate
    # on one commodity axis and apply it to another.
    clean_fba_before_activity_sets: !clean_function:trade.utilities consolidate_import_activities_fba
    activity_sets:
      goods_imports_cif:
        selection_fields:
          FlowName: GEN_CIF_YR
        attribution_method: proportional
        attribution_source:
          BEA_Detail_Supply:
            <<: *supply_mcif

  BEA_IEA:
    geoscale: national
    data_format: FBA
    # ⚠️ The service rows arrive PRE-BRIDGED to BEA commodities, mirroring the
    # export side (#771): published 2017 imports value per row, moved by a
    # growth blend of the IEA import categories the fitted bridge
    # (iea_import_bridge.csv) feeds it from. The prior within-set published
    # weighting kept category sets that fabricated on rows BEA barely uses and
    # omitted rows outright - 32.8% gross on the services imports column.
    # Noncomparable imports (S00300) bypass the bridge: the sixteen IEA leaves
    # the crosswalk routes to S00300 pass through as one direct row whose sum
    # is the #766 construction (the bridge itself never emits S-coded rows).
    activity_schema:
      bea:
        year: 2017
        hierarchy: flat
    clean_fba_before_activity_sets: !clean_function:trade.utilities bridge_iea_service_imports
    activity_sets:
      service_imports:
        selection_fields:
          FlowName: Imports
        attribution_method: direct

  # Physical electricity trade (#668): EIA Table 2.14 MWh × Census HS 2716
  # unit value. Import stubs inherit this source from the common body.
  EIA_ElectricPowerAnnual:
    geoscale: national
    data_format: FBA
    activity_to_sector_mapping: EIA_ElectricPowerAnnual
    clean_fba_before_activity_sets: !clean_function:trade.utilities dollarize_electricity_trade_fba
    activity_sets:
      electricity_imports:
        selection_fields:
          FlowName: electricity imports
        attribution_method: direct
