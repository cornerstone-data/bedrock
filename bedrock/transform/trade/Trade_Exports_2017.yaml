!include:BEA_detail_commodity_target.yaml
year: &trade_year 2017
target_schema_year: 2017
geoscale: national
activity_schema: null

_attribution_sources:
  use_f040: &use_f040
    year: 2017
    selection_fields:
      ActivityConsumedBy: {'F04000': ''}

source_names:
  Census_USATrade:
    geoscale: national
    year: *trade_year
    data_format: FBA
    activity_to_sector_mapping: Census_USATrade
    activity_sets:
      goods_exports:
        selection_fields:
          FlowName: ALL_VAL_YR
        primary_action_type: Produced
        attribution_method: proportional
        attribution_source:
          BEA_Detail_Use_SUT:
            <<: *use_f040
        clean_parameter: F04000
        clean_fbs_after_aggregation: !clean_function:flowbyclean assign_sector_consumed_by_from_clean_parameter

  BEA_IEA:
    geoscale: national
    year: *trade_year
    data_format: FBA
    activity_to_sector_mapping: BEA_IEA
    activity_sets:
      service_exports:
        selection_fields:
          FlowName: Exports
        exclusion_fields:
          ActivityProducedBy: [AllTypesOfService]
        primary_action_type: Produced
        attribution_method: proportional
        attribution_source:
          BEA_Detail_Use_SUT:
            <<: *use_f040
        clean_parameter: F04000
        clean_fbs_after_aggregation: !clean_function:flowbyclean assign_sector_consumed_by_from_clean_parameter
