# Detail Supply table for 2023. Body and rationale in Detail_Supply_Mix.yaml.
#
# ⚠️ `source_names` MUST be redeclared here, not just `year`. The !include is a
# shallow dict update, and Detail_Supply_Mix.yaml resolves `year: *summary_year`
# INSIDE its source block at parse time - so overriding only the top-level year
# leaves the source pinned to the base file's 2018 while the method reports
# 2023. get_flowby_from_config merges the source's own dict last, so the source
# wins. The failure is silent: a full table for the wrong year.
!include:Detail_Supply_Mix.yaml
year: &year 2023
source_names:
  BEA_Summary_Supply:
    !include:Detail_Supply_Mix.yaml:source_names:BEA_Summary_Supply
    year: *year
    # ⚠️ Attribute onto the census-moved mix, not the frozen 2017 one. From 2022
    # the detail split rests on the Economic Census product lines rather than on
    # the benchmark alone (#570). The summary control is unchanged, so this
    # moves value *within* summary cells and never across them.
    #
    # No exclusion_fields: BEA_Detail_Supply_PxI is already cut to commodity x
    # industry, so it carries none of the bridge columns or the T017 total the
    # plain Detail_Supply_Mix source has to drop.
    attribution_source:
      BEA_Detail_Supply_PxI:
        year: 2022
        primary_action_type: Consumed # speeds processing
        attribution_method: equal
