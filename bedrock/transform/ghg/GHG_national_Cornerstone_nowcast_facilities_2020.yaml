# Updating nowcast GHG FBS methods to attribute Stationary Combustion data with facility data

!include:GHG_national_Cornerstone_nowcast_2020.yaml
  sources_to_cache: !include:GHG_national_Cornerstone_nowcast_2020.yaml:sources_to_cache
    GHGRP_NEI_Facilities:
      data_format: FBS_outside_flowsa
      FBS_datapull_fxn: !script_function:stewiFBS facility_combustion_to_sector
      year: 2020
      inventory_dict:
        GHGRP: 2020
        NEI: 2020
      sector_prefixes:
        - '21'
        - '22'
        - '31'
        - '32'
        - '33'
      exclude_sectors:
        - '221100'
      keep_flowables:
        - Petroleum
        - Natural Gas
        - Coal
  source_names: !include:GHG_national_Cornerstone_nowcast_2020.yaml:source_names
    UMD_GHGIA_T_3_11:  # Stationary combustion - industrial
       year: 2020
       activity_to_sector_mapping: UMD_GHGIA
       clean_fba_before_activity_sets: !script_function:EPA_GHGI allocate_industrial_combustion
       clean_parameter:
         ratio_source: facilities
         year: 2020
         sector_prefixes:
           - '21'
           - '22'
           - '31'
           - '32'
           - '33'
         exclude_sectors:
           - '221100'
         keep_flowables:
           - Natural Gas
           - Coal
       fedefl_mapping: UMD_GHGIA_AR5_100
       activity_sets:
         petroleum_industrial:
           selection_fields:
             PrimaryActivity:
               - Petroleum Industrial
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Petroleum

         natural_gas_nonmanufacturing:
           selection_fields:
             PrimaryActivity:
              - Natural Gas Industrial
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Natural Gas

         ng_manufacturing:
           selection_fields:
             PrimaryActivity:
               - Natural Gas Industrial - Manufacturing
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Natural Gas

         coal_nonmanufacturing:
           selection_fields:
             PrimaryActivity:
              - Coal Industrial
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Coal

         coal_manufacturing:
           selection_fields:
             PrimaryActivity:
               - Coal Industrial - Manufacturing
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Coal

       # Intentionally left out 'Wood Commercial' and 'Wood Industrial'
