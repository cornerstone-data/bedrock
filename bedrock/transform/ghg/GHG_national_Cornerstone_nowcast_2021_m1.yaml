# Cornerstone GHG national methods (v2025), inventory year 2021 — nowcast m1.
# T_3_11 / T_3_14 only (compare MECS reduction vs baseline nowcast_2021).
# Reduce MECS Energy FBS industry weights in favor of Nowcast Use where fuel is
# already fixed. MECS kept for petroleum industrial, HGL, and transport lubricants.

!include:Cornerstone_2025_target.yaml
year: &ghgi_year 2021
target_schema_year: 2017
geoscale: national

mecs_year: &mecs_year 2022
epa_ghgi_year: &epa_ghgi_year 2021

_attribution_sources:
  # Nested EPA_GHGI_T_3_25 below is inventory, not UMD T_3_25 (petroleum-systems CH4).
  # Energy FBS: petroleum industrial (energy fraction), transport lubricants, and HGL NEU; other manufacturing/NEU sets use nowcast Use.
  Energy_manufacturing_national_nowcast_2021: &mecs_energy_alloc
    data_format: FBS
    geoscale: national

  Nowcast: &nowcast # NowcastMUT after-redef Use at inventory year
    year: *ghgi_year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      # Drop FD columns that should not take intermediate attribution
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    attribution_method: equal

source_names:
  UMD_GHGIA_T_3_11:  # Stationary combustion - industrial
     year: *ghgi_year
     activity_to_sector_mapping: UMD_GHGIA
     # note - below clean function splits ghgi data into manufacturing and non manufacturing
     # while ceda does not originally use this terminology/append "manufacturing" to activity names, ceda
     # accomplishes the same methods through
     # _allocate_industrial_coal_to_industries_energy_allocation() + _allocate_remaining_industrial_coal_usage()
     clean_fba_before_activity_sets: !script_function:EPA_GHGI allocate_industrial_combustion
     clean_parameter: # Override each year for use in allocate_industrial_combustion
        energy_fba: 'EIA_MECS_Energy'
        year: *mecs_year
        ghg_fba: 'UMD_GHGIA_T_A5_1_S2'  # align with 2022 MECS
     fedefl_mapping: UMD_GHGIA_AR5_100
     activity_sets:
       petroleum_industrial:
         selection_fields:
           PrimaryActivity:
             - Petroleum Industrial
         attribution_method: proportional
         attribution_source:
           Energy_manufacturing_national_nowcast_2021:
             <<: *mecs_energy_alloc
             selection_fields:
               Flowable: Petroleum
               Class: Money

       natural_gas_nonmanufacturing:
         selection_fields:
           PrimaryActivity:
            - Natural Gas Industrial
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'221200': ''}  # purchases of natural gas

       ng_manufacturing:
         selection_fields:
           PrimaryActivity:
             - Natural Gas Industrial - Manufacturing
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'221200': ''}  # purchases of natural gas

       coal_nonmanufacturing: # empty in some years (i.e., all coal consumption for manufacturing)
         selection_fields:
           PrimaryActivity:
            - Coal Industrial
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'212100': ''}  # purchases of coal

       coal_manufacturing:
         selection_fields:
           PrimaryActivity:
            - Coal Industrial - Manufacturing
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'212100': ''}  # purchases of coal

     # Intentionally left out 'Wood Commercial' and 'Wood Industrial'

  UMD_GHGIA_T_3_14: # UMD Table 3-14 totals; allocate via EPA T_3_25b
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA
    fedefl_mapping: UMD_GHGIA_AR5_100
    activity_sets:
      emissions:
        selection_fields:
          PrimaryActivity: Emissions NEU Fossil Fuel Consumption
        attribution_method: proportional
        attribution_source:
          EPA_GHGI_T_3_25b:
            year: *epa_ghgi_year
            activity_to_sector_mapping: EPA_GHGI_Cornerstone
            fedefl_mapping: GHGI_AR5_100
            activity_sets:
              coal:
                selection_fields:
                  PrimaryActivity:
                    - Industry Industrial Coking Coal
                    - Industry Industrial Other Coal
                attribution_method: direct

              petroleum_neu_asphalt:
                selection_fields:
                  PrimaryActivity:
                    'Industry Asphalt & Road Oil': Industry Petroleum Products Non-energy
                attribution_method: proportional
                attribution_source:
                  Nowcast_Detail_Use_AfterRedef:
                    <<: *nowcast
                    selection_fields:
                      ActivityProducedBy: {'324110': ''}
                      # Allocated to asphalt sectors only
                      ActivityConsumedBy:
                        - '324121'
                        - '324122'

              petroleum_neu_hgl:
                selection_fields:
                  PrimaryActivity:
                    Industry HGL: Industry Petroleum Products Non-energy
                attribution_method: proportional
                attribution_source:
                  # MECS Table 2.1 HGL mix (chemicals-heavy); keep Energy FBS slice
                  Energy_manufacturing_national_nowcast_2021:
                    <<: *mecs_energy_alloc
                    selection_fields:
                      Flowable: HGL
                      Class: Other

              petroleum_neu:
                selection_fields:
                  PrimaryActivity:
                    Industry Distillate Fuel Oil: Industry Petroleum Products Non-energy
                    Industry Lubricants: Industry Petroleum Products Non-energy
                    Industry Miscellaneous Products: Industry Petroleum Products Non-energy
                    'Industry Naphtha (<401 F)': Industry Petroleum Products Non-energy
                    'Industry Other Oil (>401 F)': Industry Petroleum Products Non-energy
                    Industry Petroleum Coke: Industry Petroleum Products Non-energy
                    Industry Special Naphtha: Industry Petroleum Products Non-energy
                    Industry Still Gas: Industry Petroleum Products Non-energy
                    Industry Waxes: Industry Petroleum Products Non-energy
                    Industry Natural Gasoline: Industry Petroleum Products Non-energy
                attribution_method: proportional
                attribution_source:
                  Nowcast_Detail_Use_AfterRedef:
                    <<: *nowcast
                    selection_fields:
                      ActivityProducedBy: {'324110': ''}
                    exclusion_fields:
                      # Skips petroleum products used for asphalt sectors
                      ActivityConsumedBy:
                        - '324121'
                        - '324122'

              natural_gas_neu:
                selection_fields:
                  PrimaryActivity: Industry Natural Gas to Chemical Plants
                attribution_method: proportional
                attribution_source:
                  Nowcast_Detail_Use_AfterRedef:
                    <<: *nowcast
                    selection_fields:
                      ActivityProducedBy: {'221200': ''}
                    clean_fba: !script_function:EIA_MECS keep_chemical_manufacturing

              transportation_lubricants:
                selection_fields:
                  PrimaryActivity: Transportation Lubricants
                attribution_method: proportional
                attribution_source:
                  Energy_manufacturing_national_nowcast_2021:
                    <<: *mecs_energy_alloc
                    selection_fields:
                      Flowable: Transport
                      Class: Money
