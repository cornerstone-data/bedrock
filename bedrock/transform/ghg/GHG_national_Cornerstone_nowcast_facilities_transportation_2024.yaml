# Facilities GHG method with highway fuel allocated by vehicle class and
# owner (Energy_highway_fuel_shares). Uses the transportation sector
# crosswalk; otherwise inherits the facilities method.
# Modifies UMD GHGIA T_3_8 / T_3_9 / T_3_10


!include:GHG_national_Cornerstone_nowcast_facilities_2024.yaml
  _attribution_sources: !include:GHG_national_Cornerstone_nowcast_2024.yaml:_attribution_sources
    Energy_highway_fuel_shares_national_2024: &highway_fuel_shares
      data_format: FBS
      geoscale: national
    Nowcast: &nowcast
      year: 2024
      activity_to_sector_mapping: Cornerstone_2025
      exclusion_fields:
        ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                             'F06E00', 'F07E00', 'F10E00', 'F02R00']
      attribution_method: equal

  source_names: !include:GHG_national_Cornerstone_nowcast_facilities_2024.yaml:source_names
    UMD_GHGIA_T_3_8: !include:GHG_national_Cornerstone_nowcast_facilities_2024.yaml:source_names:UMD_GHGIA_T_3_8
      activity_to_sector_mapping: UMD_GHGIA_transportation
      activity_sets: !include:GHG_national_Cornerstone_nowcast_facilities_2024.yaml:source_names:UMD_GHGIA_T_3_8:activity_sets
        # Non-road / motorcycle / buses; cars / LDT / MHD gas via highway shares.
        direct_gasoline:
          selection_fields:
            PrimaryActivity:
              Buses Gasoline: Buses
              Motorcycles Gasoline: Motorcycles
              Recreational Boats Gasoline: Recreational Boats
          attribution_method: direct

        # Parent petroleum_fuels_diesel (Use of 324110) replaced by highway splits.
        petroleum_fuels_diesel:
          selection_fields:
            PrimaryActivity:
              Medium- and Heavy-Duty Trucks Diesel Fuel: Medium- and Heavy-Duty Trucks - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2024:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Trucks'

        petroleum_fuels_diesel_buses:
          selection_fields:
            PrimaryActivity:
              Buses Diesel Fuel: Buses - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2024:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Buses'

        petroleum_fuels_diesel_automobiles:
          selection_fields:
            PrimaryActivity:
              Passenger Cars Diesel Fuel: Passenger Cars
              Light-Duty Trucks Diesel Fuel: Light-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2024:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Automobiles'

        # Parent petroleum_fuels_gasoline (Use of 324110) → highway automobiles.
        petroleum_fuels_gasoline:
          selection_fields:
            PrimaryActivity:
              Passenger Cars Gasoline: Passenger Cars
              Light-Duty Trucks Gasoline: Light-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2024:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Gasoline; Automobiles'

        petroleum_fuels_gasoline_trucks:
          selection_fields:
            PrimaryActivity:
              Medium- and Heavy-Duty Trucks Gasoline: Medium- and Heavy-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2024:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Gasoline; Trucks'

    UMD_GHGIA_T_3_9: &mobile !include:GHG_national_Cornerstone_nowcast_2024.yaml:source_names:UMD_GHGIA_T_3_9
      activity_to_sector_mapping: UMD_GHGIA_transportation
      activity_sets: !include:GHG_national_Cornerstone_nowcast_2024.yaml:source_names:UMD_GHGIA_T_3_9:activity_sets
        petroleum_fuels_diesel:
          selection_fields:
            PrimaryActivity:
              Medium- and Heavy-Duty Trucks Diesel On-Road: Medium- and Heavy-Duty Trucks - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2024:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Trucks'

    UMD_GHGIA_T_3_10: *mobile # N2O from mobile combustion duplicates method for CH4
