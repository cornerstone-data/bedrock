# Updating nowcast GHG FBS methods to attribute Stationary Combustion data with facility data

!include:GHG_national_Cornerstone_nowcast_2021.yaml
  sources_to_cache: !include:GHG_national_Cornerstone_nowcast_2021.yaml:sources_to_cache
    GHGRP_NEI_Facilities:
      data_format: FBS_outside_flowsa
      FBS_datapull_fxn: !script_function:stewiFBS facility_combustion_to_sector
      year: 2021
      inventory_dict:
        GHGRP: 2021
        NEI: 2021
      sector_prefixes:
        - '21'
        - '22'
        - '31'
        - '32'
        - '33'
      exclude_sectors:
        - '221100'
      keep_flowables:
        - Petroleum
        - Natural Gas
        - Coal
  source_names: !include:GHG_national_Cornerstone_nowcast_2021.yaml:source_names
    UMD_GHGIA_T_3_11:  # Stationary combustion - industrial
       year: 2021
       activity_to_sector_mapping: UMD_GHGIA
       clean_fba_before_activity_sets: !script_function:UMD_GHGIA prepare_facilities_industrial_combustion
       clean_parameter:
         year: 2021
         nei_year: 2021
         annex_fba: 'UMD_GHGIA_T_A5_1_S3'
         annex_year: 2021
       fedefl_mapping: UMD_GHGIA_AR5_100
       activity_sets:
         petroleum_still_gas:
           selection_fields:
             PrimaryActivity:
               - Petroleum Industrial - Still Gas
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Petroleum

         # Coke / HGL / kerosene share the same facility petroleum weights
         petroleum_facility:
           selection_fields:
             PrimaryActivity:
               - Petroleum Industrial - Petroleum Coke
               - Petroleum Industrial - HGL
               - Petroleum Industrial - Kerosene
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Petroleum

         # Distillate / motor gasoline share the same Use petroleum consumers
         petroleum_use:
           selection_fields:
             PrimaryActivity:
               - Petroleum Industrial - Distillate Fuel Oil
               - Petroleum Industrial - Motor Gasoline
           attribution_method: proportional
           attribution_source:
             Nowcast_Detail_Use_AfterRedef:
               year: 2021
               activity_to_sector_mapping: Cornerstone_2025
               selection_fields:
                 ActivityProducedBy: {'324110': ''}
               clean_fba: !script_function:EIA_MECS keep_industrial_petroleum_consumers
               attribution_method: equal

         natural_gas_lease_plant:
           selection_fields:
             PrimaryActivity:
               - Natural Gas Industrial - Lease and Plant
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Natural Gas - lease and plant

         natural_gas_nonmanufacturing:
           selection_fields:
             PrimaryActivity:
              - Natural Gas Industrial
           attribution_method: proportional
           attribution_source:
             Nowcast_Detail_Use_AfterRedef:
               year: 2021
               activity_to_sector_mapping: Cornerstone_2025
               selection_fields:
                 ActivityProducedBy: {'221200': ''}
               attribution_method: equal

         ng_manufacturing:
           selection_fields:
             PrimaryActivity:
               - Natural Gas Industrial - Manufacturing
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Natural Gas

         coal:
           selection_fields:
             PrimaryActivity:
              - Coal Industrial
              - Coal Industrial - Manufacturing
           attribution_method: proportional
           attribution_source:
             GHGRP_NEI_Facilities:
               selection_fields:
                 Flowable: Coal

       # Intentionally left out 'Wood Commercial' and 'Wood Industrial'
