# Cornerstone GHG national method, inventory year 2020.
# Nowcast Use attribution, facility combustion, and on-road gasoline and
# diesel via highway fuel shares. Uses UMD GHGIA FBAs. Some nested EPA GHGI
# tables remain for soils / NEU allocation and fluorochemical MT detail.

!include:Cornerstone_2025_target.yaml
# Keep GHGI ActivityProducedBy so source-resolved E can map inventory lines.
retain_activity_columns: true
year: &ghgi_year 2020
target_schema_year: 2017
geoscale: national

ghgrp_sector_floor: 2020

mecs_year: &mecs_year 2018
coa_year: &coa_year 2017
epa_ghgi_year: &epa_ghgi_year 2020

sources_to_cache:
  USDA_CoA_Cropland_NAICS:
    year: *coa_year
    # Between censuses, blend 2017 and 2022 linearly (#934).
    clean_fba: !clean_function:flowbyclean interpolate_census_years
    census_interpolation:
      years: [2017, 2022]
      target_year: *ghgi_year
    selection_fields:
      Class: Land
      FlowName:
        - FARM OPERATIONS
        - AG LAND, CROPLAND, HARVESTED
    estimate_suppressed: !clean_function:flowbyclean estimate_suppressed_sectors_equal_attribution

  # Pure facility combustion (prefer-GHGRP): FlowAmount is CO2e in kg.
  # Used for lease/plant NG and still gas (no MECS/Use fallback).
  GHGRP_NEI_Facilities:
    data_format: FBS_outside_flowsa
    FBS_datapull_fxn: !script_function:stewiFBS facility_combustion_to_sector
    year: 2020
    inventory_dict:
      GHGRP: 2020
      NEI: 2020
    sector_prefixes:
      - '21'
      - '22'
      - '31'
      - '32'
      - '33'
    exclude_sectors:
      - '221100'
    # Facility sector-weight Flowables (Petroleum / Natural Gas / Coal).
    # Lease/plant NG is added later from GHGRP subpart W as its own Flowable
    # ("Natural Gas - lease and plant").
    keep_flowables:
      - Petroleum
      - Natural Gas
      - Coal
  # Attribution shares on SectorConsumedBy (Unit=share). One FBS with
  # Natural Gas / Coal / Petroleum; each fuel's FlowAmount sums to 1.
  # Facility CO2e and MECS (Energy bcf/kg or Money USD) become NAICS shares,
  # then: keep_prior->MECS, facility_vector->facility,
  # facility_floor->max(shares); renormalize per fuel. Still gas stays on
  # GHGRP_NEI (kg).
  Hybrid_Facility_MECS:
    data_format: FBS_outside_flowsa
    FBS_datapull_fxn: !script_function:stewiFBS hybrid_facility_mecs_to_sector
    year: 2020
    inventory_dict:
      GHGRP: 2020
      NEI: 2020
    min_coverage: 0.8
    sector_prefixes:
      - '21'
      - '22'
      - '31'
      - '32'
      - '33'
    exclude_sectors:
      - '221100'
    mecs_method: Energy_manufacturing_national_nowcast_2020
    flowables:
      Natural Gas: Energy
      Coal: Energy
      Petroleum: Money
    keep_flowables:
      - Natural Gas
      - Coal
      - Petroleum

_attribution_sources:
  # Nested EPA_GHGI_T_3_25 below is inventory, not UMD T_3_25 (petroleum-systems CH4).
  Energy_manufacturing_national_nowcast_2020: &mecs_energy_alloc
    data_format: FBS
    geoscale: national

  Energy_highway_fuel_shares_national_2020: &highway_fuel_shares
    data_format: FBS
    geoscale: national

  Nowcast: &nowcast # NowcastMUT after-redef Use at inventory year
    year: *ghgi_year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      # Drop FD columns that should not take intermediate attribution
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    attribution_method: equal

source_names:
  UMD_GHGIA_T_2_S1: # U.S. GHG totals
     year: *ghgi_year
     activity_to_sector_mapping: UMD_GHGIA
     fedefl_mapping: UMD_GHGIA_AR5_100
     activity_sets:
       direct:
         selection_fields:
           PrimaryActivity:
             - Abandoned Oil and Gas Wells #CH4
             - Abandoned Underground Coal Mines #CH4
             - Adipic Acid Production #N2O
             - Aluminum Production #CO2
             - Ammonia Production #CO2
             - Anaerobic Digestion at Biogas Facilities #CH4
             - Caprolactam, Glyoxal, and Glyoxylic Acid Production #N2O
             - Carbide Production and Consumption #CO2
             - Cement Production #CO2
             - Coal Mining #CH4, CO2
             - Composting #CH4, N2O
             - Ferroalloy Production #CO2, CH4
             - Glass Production #CO2
             - Landfills #CH4
             - Lead Production #CO2
             - Incineration of Waste #N2O and CO2
             - Lime Production #CO2
             - Iron and Steel Production & Metallurgical Coke Production #CO2, CH4
             - Nitric Acid Production #N2O
             - Phosphoric Acid Production #CO2
             - Rice Cultivation #CH4
             - Soda Ash Production #CO2
             - Titanium Dioxide Production #CO2
             - Wastewater Treatment #CH4, N2O
             - Zinc Production #CO2
           FlowName: ["CO2", "CH4", "N2O"] # HFCs and other flows are pulled elsewhere
         attribution_method: direct
       electricity_transmission:
         selection_fields:
           PrimaryActivity:
             - Electrical Equipment  # SF6
           FlowName: SF6
         attribution_method: direct

       liming: # liming of agricultural soils
         selection_fields:
           PrimaryActivity: Liming #CO2
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'327400': ''} # Lime and Gypsum Products

       urea:
         selection_fields:
           PrimaryActivity:
             - Urea Consumption for Non-Agricultural Purposes # CO2
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'325310': ''} # Fertilizers

       urea_fertilizer:
         selection_fields:
           PrimaryActivity: Urea Fertilization # CO2
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             # Each crop's fertilizer purchases follow its revenue year to
             # year; blend the census-year tables instead (#934).
             year: *coa_year
             clean_fba: !clean_function:flowbyclean interpolate_census_years
             census_interpolation:
               years: [2017, 2022]
               target_year: *ghgi_year
               normalize: true
             selection_fields:
               ActivityProducedBy: {'325310': ''} # Fertilizers

       carbonate_use:
         selection_fields:
           PrimaryActivity: Other Process Uses of Carbonates # CO2
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'325180': ''} # Other Basic Inorganic Chemicals

       nitrous_oxide_use:
         selection_fields:
           PrimaryActivity: N2O from Product Uses # N2O
         attribution_method: proportional
         attribution_source:
           Nowcast_Detail_Use_AfterRedef:
             <<: *nowcast
             selection_fields:
               ActivityProducedBy: {'325120': ''} # Industrial gases

       field_burning_n2O:
         selection_fields:
           PrimaryActivity:
             - Field Burning of Agricultural Residues
           FlowName: ["N2O"]
         attribution_method: proportional
         attribution_source:
           UMD_GHGIA_T_5_15: &field_burning
             year: *ghgi_year
             activity_to_sector_mapping: UMD_GHGIA
             selection_fields:
               PrimaryActivity:
                 - Chickpeas
                 - Cotton
                 - Maize
                 - Rice
                 - Soybeans
                 - Wheat
                 - Lentils
                 - Sugarcane
               FlowName:
                 CH4: N2O # replacing flow name
             attribution_method: direct

       field_burning_ch4:
         selection_fields:
           PrimaryActivity:
             - Field Burning of Agricultural Residues
           FlowName: ["CH4"]
         attribution_method: proportional
         attribution_source:
           UMD_GHGIA_T_5_15:
             <<: *field_burning
             selection_fields:
               PrimaryActivity:
                 - Chickpeas
                 - Cotton
                 - Maize
                 - Rice
                 - Soybeans
                 - Wheat
                 - Lentils
                 - Sugarcane
               FlowName: ["CH4"]


## Fossil Fuels
  UMD_GHGIA_T_3_28: &natgas #CH4 from Natural Gas Systems
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA
    fedefl_mapping: UMD_GHGIA_AR5_100
    selection_fields:
      PrimaryActivity:
        - Distribution
        - Post-Meter
        - Exploration
        - Processing
        - Production
        - Transmission and Storage
    attribution_method: direct
  UMD_GHGIA_T_3_29: *natgas # CO2 from Natural Gas Systems mimics CH4
  UMD_GHGIA_T_3_30: *natgas # N2O from Natural Gas Systems mimics CH4, note 3-30 does not have "Post-Meter"

  UMD_GHGIA_T_3_25: &petroleum #CH4 from Petroleum Systems
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA
    fedefl_mapping: UMD_GHGIA_AR5_100
    selection_fields:
      PrimaryActivity:
#        - Crude Oil Transportation  # not included in UMD
        - Transportation
        - Exploration
        - Production
        - Refineries
#        - Crude Refining  # not included in UMD
    attribution_method: direct
  UMD_GHGIA_T_3_26: *petroleum # CO2 from Petroleum Systems mimics CH4
  UMD_GHGIA_T_3_27: *petroleum # N2O from Petroleum Systems mimics CH4

## Agriculture
  UMD_GHGIA_T_5_3:  &animals #CH4 from Enteric Fermentation
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA
    fedefl_mapping: UMD_GHGIA_AR5_100
    selection_fields:
      PrimaryActivity:
        - American Bison
        - Beef Cattle
        - Dairy Cattle
        - Goats
        - Horses
        - Mules and Asses
        - Sheep
        - Swine
        - Poultry  # note, not in 5-3, is included in 5-6
    attribution_method: direct
  UMD_GHGIA_T_5_6:  *animals # CH4 and N2O from manure management

  UMD_GHGIA_T_5_10: # UMD Table 5-10 totals; allocate via EPA T_5_18 (direct) and T_5_19 (indirect)
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA
    fedefl_mapping: UMD_GHGIA_AR5_100
    activity_sets:
      direct:
        selection_fields:
          PrimaryActivity: Direct Agricultural Soil Management
        attribution_method: proportional
        attribution_source:
          EPA_GHGI_T_5_18:
            year: *epa_ghgi_year
            activity_to_sector_mapping: EPA_GHGI_Cornerstone
            fedefl_mapping: GHGI_AR5_100
            activity_sets:
              fertilizer_use:
                selection_fields:
                  PrimaryActivity:
                    - Organic Amendment Cropland
                    - Residue N Cropland
                    - Synthetic Fertilizer Cropland
                attribution_method: proportional
                attribution_source:
                  Nowcast_Detail_Use_AfterRedef:
                    <<: *nowcast
                    # Each crop's fertilizer purchases follow its revenue year to
                    # year; blend the census-year tables instead (#934).
                    year: *coa_year
                    clean_fba: !clean_function:flowbyclean interpolate_census_years
                    census_interpolation:
                      years: [2017, 2022]
                      target_year: *ghgi_year
                      normalize: true
                    selection_fields:
                      ActivityProducedBy: {'325310': ''} # fertilizer sectors

              cropland:
                selection_fields:
                  PrimaryActivity:
                    - Mineralization and Asymbiotic Fixation Cropland
                    - Drained Organic Soils Cropland
                attribution_method: proportional
                attribution_source:
                  USDA_CoA_Cropland:
                    year: *coa_year
                    clean_fba: !clean_function:flowbyclean interpolate_census_years
                    census_interpolation:
                      years: [2017, 2022]
                      target_year: *ghgi_year
                    selection_fields:
                      Class: Land
                      FlowName:
                        - AREA HARVESTED
                        - AREA BEARING & NON-BEARING # Orchards
                        - AREA GROWN # Berry totals
                    attribution_method: proportional
                    attribution_source:
                      USDA_CoA_Cropland_NAICS:
                        selection_fields:
                          Flowable: AG LAND, CROPLAND, HARVESTED

              pasture:
                selection_fields:
                  PrimaryActivity:
                    - All activities Grassland
                attribution_method: proportional
                attribution_source:
                  USDA_CoA_Cropland_NAICS:
                    selection_fields:
                      Flowable: FARM OPERATIONS

      indirect:
        selection_fields:
          PrimaryActivity: Indirect Agricultural Soil Management
        attribution_method: proportional
        attribution_source:
          EPA_GHGI_T_5_19:
            year: *epa_ghgi_year
            activity_to_sector_mapping: EPA_GHGI_Cornerstone
            fedefl_mapping: GHGI_AR5_100
            activity_sets:
              fertilizer_use:
                selection_fields:
                  PrimaryActivity:
                    - Volatilization & Atm. Deposition Cropland
                    - Surface Leaching & Run-Off Cropland
                attribution_method: proportional
                attribution_source:
                  Nowcast_Detail_Use_AfterRedef:
                    <<: *nowcast
                    # Each crop's fertilizer purchases follow its revenue year to
                    # year; blend the census-year tables instead (#934).
                    year: *coa_year
                    clean_fba: !clean_function:flowbyclean interpolate_census_years
                    census_interpolation:
                      years: [2017, 2022]
                      target_year: *ghgi_year
                      normalize: true
                    selection_fields:
                      ActivityProducedBy: {'325310': ''} # fertilizer sectors

              pasture:
                selection_fields:
                  PrimaryActivity:
                    - All activities Grassland
                attribution_method: proportional
                attribution_source:
                  USDA_CoA_Cropland_NAICS:
                    selection_fields:
                      Flowable: FARM OPERATIONS


### Mobile Sources
  UMD_GHGIA_T_3_8: #CO2 from mobile combustion
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA_transportation
    fedefl_mapping: UMD_GHGIA_AR5_100
    clean_fba_before_activity_sets: !script_function:UMD_GHGIA prepare_facilities_mobile_combustion
    clean_parameter:
      year: 2020
    activity_sets:
      direct_residual_fuel_oil:
        selection_fields:
          PrimaryActivity:
            Ships & Boats Residual Fuel Oil: Ships and Boats
        attribution_method: direct

      direct_lpg:
        selection_fields:
          PrimaryActivity:
            Buses LPG: Buses
            Medium- and Heavy-Duty Trucks LPG: Medium- and Heavy-Duty Trucks
            Light-Duty Trucks LPG: Light-Duty Trucks - Households
            Passenger Cars LPG: Passenger Cars - Households
        attribution_method: direct

      direct_jet:
        selection_fields:
          PrimaryActivity:
            General Aviation Aircraft Aviation Gasoline: General Aviation Aircraft
            General Aviation Aircraft Jet Fuel: General Aviation Aircraft
            Commercial Aircraft Jet Fuel: Commercial Aircraft
            Military Aircraft Jet Fuel: Military Aircraft
        attribution_method: direct

      direct_ng:
        selection_fields:
          PrimaryActivity:
            Buses Natural Gas: Buses
            Pipeline Natural Gas: Pipeline Natural Gas
            Medium- and Heavy-Duty Trucks Natural Gas: Medium- and Heavy-Duty Trucks
        attribution_method: direct

      direct_diesel:
        selection_fields:
          PrimaryActivity:
            Rail Diesel Fuel: Rail
            Recreational Boats Diesel Fuel: Recreational Boats
            Ships and Non-Recreational Boats Diesel Fuel: Ships and Non-Recreational Boats
        attribution_method: direct

      # Non-road / motorcycle / buses; cars / LDT / MHD via highway shares.
      direct_gasoline:
        selection_fields:
          PrimaryActivity:
            Buses Gasoline: Buses
            Motorcycles Gasoline: Motorcycles
            Recreational Boats Gasoline: Recreational Boats
        attribution_method: direct

      petroleum_fuels_diesel:
        selection_fields:
          PrimaryActivity:
            Medium- and Heavy-Duty Trucks Diesel Fuel: Medium- and Heavy-Duty Trucks - Distillate Fuel Oil
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Diesel; Trucks'
      petroleum_fuels_diesel_buses:
        selection_fields:
          PrimaryActivity:
            Buses Diesel Fuel: Buses - Distillate Fuel Oil
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Diesel; Buses'
      petroleum_fuels_diesel_automobiles:
        selection_fields:
          PrimaryActivity:
            Passenger Cars Diesel Fuel: Passenger Cars
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Diesel; Automobiles'
      petroleum_fuels_diesel_light_duty_trucks:
        selection_fields:
          PrimaryActivity:
            Light-Duty Trucks Diesel Fuel: Light-Duty Trucks
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Diesel; Automobiles'

      petroleum_fuels_gasoline:
        selection_fields:
          PrimaryActivity:
            Passenger Cars Gasoline: Passenger Cars
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Gasoline; Automobiles'
      petroleum_fuels_gasoline_light_duty_trucks:
        selection_fields:
          PrimaryActivity:
            Light-Duty Trucks Gasoline: Light-Duty Trucks
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Gasoline; Automobiles'
      petroleum_fuels_gasoline_trucks:
        selection_fields:
          PrimaryActivity:
            Medium- and Heavy-Duty Trucks Gasoline: Medium- and Heavy-Duty Trucks
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Gasoline; Trucks'
      lng_liquefaction:
        selection_fields:
          PrimaryActivity:
            - Pipeline Natural Gas - LNG Liquefaction
        attribution_method: proportional
        attribution_source:
          GHGRP_NEI_Facilities:
            selection_fields:
              Flowable: Natural Gas - LNG liquefaction

  UMD_GHGIA_T_3_9: &mobile #CH4 from mobile combustion
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA_transportation
    fedefl_mapping: UMD_GHGIA_AR5_100
    activity_sets:
      direct_gasoline: # empty in some years (<0.05 MMT CO2eq)
        selection_fields:
          PrimaryActivity:
            Motorcycles Gasoline On-Road: Motorcycles
            Medium- and Heavy-Duty Trucks and Buses Gasoline On-Road: Medium- and Heavy-Duty Trucks and Buses
        attribution_method: direct

      direct_diesel:
        selection_fields:
          PrimaryActivity:
            Passenger Cars Diesel On-Road: Passenger Cars - Households
            Medium- and Heavy-Duty Buses Diesel On-Road: Medium- and Heavy-Duty Buses
        attribution_method: direct

      direct_non_road:
        selection_fields:
          PrimaryActivity:
            Rail Non-Road: Rail
            Ships and Boats Non-Road: Ships and Boats
            Aircraft Non-Road: General Aviation Aircraft
        attribution_method: direct

      petroleum_fuels_diesel:
        selection_fields:
          PrimaryActivity:
            Medium- and Heavy-Duty Trucks Diesel On-Road: Medium- and Heavy-Duty Trucks - Distillate Fuel Oil
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Diesel; Trucks'
      light_duty_trucks_diesel:
        selection_fields:
          PrimaryActivity:
            Light-Duty Trucks Diesel On-Road: Light-Duty Trucks
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Diesel; Automobiles'

      petroleum_fuels_gasoline:
        selection_fields:
          PrimaryActivity:
            Passenger Cars Gasoline On-Road: Passenger Cars - Households
        attribution_method: direct
      light_duty_trucks_gasoline:
        selection_fields:
          PrimaryActivity:
            Light-Duty Trucks Gasoline On-Road: Light-Duty Trucks
        attribution_method: proportional
        attribution_source:
          Energy_highway_fuel_shares_national_2020:
            <<: *highway_fuel_shares
            selection_fields:
              Flowable: 'Gasoline; Automobiles'

      construction_and_mining: #this set is allocated by purchases of construction equipment
        selection_fields:
          PrimaryActivity: Construction/Mining Equipment Non-Road
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'333120': ''} # purchases of construction/mining equipment

      farm_non_road: #this set is allocated by purchases of farm machinery
        selection_fields:
          PrimaryActivity: Agricultural Equipment Non-Road
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'333111': ''} # purchases of farm machinery

      other_non_road: #this set is allocated by purchases of petroleum refining
        selection_fields:
          PrimaryActivity: Other Non-Road
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'324110': ''} # purchases of refinery products

      alt_fuel_on_road: #this set is allocated by purchases of natural gas
        selection_fields: # empty in some years (<0.05 MMT CO2eq)
          PrimaryActivity:
            All activities Alternative Fuel On-Road: Alternative Fuel On-Road
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'221200': ''} # purchases of natural gas

  UMD_GHGIA_T_3_10:  *mobile #N2O from mobile combustion duplicates method for CH4

## Stationary Combustion
  UMD_GHGIA_T_3_4: &umd_t_3_4 # stationary combustion -  CO2 residential + commercial (other gases from 3-12)
    year: *ghgi_year
    activity_to_sector_mapping: UMD_GHGIA
    fedefl_mapping: UMD_GHGIA_AR5_100
    activity_sets:
      residential_commercial_co2:
        selection_fields:
          FlowName: CO2
          PrimaryActivity:
            - Coal Residential
            - Natural Gas Residential
            - Petroleum Residential
        attribution_method: direct

      non_manufacturing_coal:
        selection_fields:
          PrimaryActivity:
            - Coal Commercial
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'212100': ''} # purchases of coal

      non_manufacturing_natural_gas:
        selection_fields:
          PrimaryActivity:
            - Natural Gas Commercial
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'221200': ''} # purchases of natural gas

      petroleum_commercial:
        selection_fields:
          PrimaryActivity:
            - Petroleum Commercial
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast
            selection_fields:
              ActivityProducedBy: {'324110': ''} # purchases of refinery products

  EPA_eGRID_electric:  # stationary combustion - electricity (plant-level eGRID; replaces UMD T_2_S1 electric_power + T_3_7)
    activity_to_sector_mapping: EPA_eGRID
    FBS_datapull_fxn: !script_function:stewiFBS egrid_to_sector
    inventory_dict:
      eGRID: *ghgi_year
    year: *ghgi_year
    include_flow_names:
      - Carbon dioxide
      - Methane
      - Nitrous oxide

  UMD_GHGIA_T_3_11:  # Stationary combustion - industrial
     year: 2020
     activity_to_sector_mapping: UMD_GHGIA
     clean_fba_before_activity_sets: !script_function:UMD_GHGIA prepare_facilities_industrial_combustion
     clean_parameter:
       year: 2020
       nei_year: 2020
       annex_fba: 'UMD_GHGIA_T_A5_1_S4'
       annex_year: 2020
       exclude_sectors:
         - '221100'
     fedefl_mapping: UMD_GHGIA_AR5_100
     activity_sets:
       petroleum_still_gas:
         selection_fields:
           PrimaryActivity:
             - Petroleum Industrial - Still Gas
         attribution_method: proportional
         attribution_source:
           GHGRP_NEI_Facilities:
             selection_fields:
               Flowable: Petroleum
               # Still gas is refinery fuel: weight on refineries'
               # own petroleum only, not every facility's.
               # The cached source carries refineries at industry spec, 32411;
               # '324110' alone matched nothing and dropped all still gas.
