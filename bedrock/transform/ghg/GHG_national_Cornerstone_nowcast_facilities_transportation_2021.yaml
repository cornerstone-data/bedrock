# Facilities GHG method. Truck, bus, and passenger-car rows use highway
# fuel shares (private industries already attributed with VIUS in the
# energy FBS). Uses the transportation sector crosswalk; otherwise
# inherits the facilities method.
# Modifies UMD GHGIA T_3_8 / T_3_9 / T_3_10, and T_3_11 industrial distillate


!include:GHG_national_Cornerstone_nowcast_facilities_2021.yaml
  _attribution_sources: !include:GHG_national_Cornerstone_nowcast_2021.yaml:_attribution_sources
    Energy_highway_fuel_shares_national_2021: &highway_fuel_shares
      data_format: FBS
      geoscale: national
    Nowcast: &nowcast
      year: 2021
      activity_to_sector_mapping: Cornerstone_2025
      exclusion_fields:
        ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                             'F06E00', 'F07E00', 'F10E00', 'F02R00']
      attribution_method: equal

  source_names: !include:GHG_national_Cornerstone_nowcast_facilities_2021.yaml:source_names
    UMD_GHGIA_T_3_8: !include:GHG_national_Cornerstone_nowcast_facilities_2021.yaml:source_names:UMD_GHGIA_T_3_8
      activity_to_sector_mapping: UMD_GHGIA_transportation
      activity_sets: !include:GHG_national_Cornerstone_nowcast_facilities_2021.yaml:source_names:UMD_GHGIA_T_3_8:activity_sets
        # Non-road / motorcycle / buses; cars / LDT / MHD via highway shares.
        direct_gasoline:
          selection_fields:
            PrimaryActivity:
              Buses Gasoline: Buses
              Motorcycles Gasoline: Motorcycles
              Recreational Boats Gasoline: Recreational Boats
          attribution_method: direct

        petroleum_fuels_diesel:
          selection_fields:
            PrimaryActivity:
              Medium- and Heavy-Duty Trucks Diesel Fuel: Medium- and Heavy-Duty Trucks - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Trucks'

        petroleum_fuels_diesel_buses:
          selection_fields:
            PrimaryActivity:
              Buses Diesel Fuel: Buses - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Buses'

        petroleum_fuels_diesel_automobiles:
          selection_fields:
            PrimaryActivity:
              Passenger Cars Diesel Fuel: Passenger Cars
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Automobiles'

        petroleum_fuels_diesel_light_duty_trucks:
          selection_fields:
            PrimaryActivity:
              Light-Duty Trucks Diesel Fuel: Light-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Automobiles'

        petroleum_fuels_gasoline:
          selection_fields:
            PrimaryActivity:
              Passenger Cars Gasoline: Passenger Cars
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Gasoline; Automobiles'

        petroleum_fuels_gasoline_light_duty_trucks:
          selection_fields:
            PrimaryActivity:
              Light-Duty Trucks Gasoline: Light-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Gasoline; Automobiles'

        petroleum_fuels_gasoline_trucks:
          selection_fields:
            PrimaryActivity:
              Medium- and Heavy-Duty Trucks Gasoline: Medium- and Heavy-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Gasoline; Trucks'

    UMD_GHGIA_T_3_9: &mobile !include:GHG_national_Cornerstone_nowcast_2021.yaml:source_names:UMD_GHGIA_T_3_9
      activity_to_sector_mapping: UMD_GHGIA_transportation
      activity_sets: !include:GHG_national_Cornerstone_nowcast_2021.yaml:source_names:UMD_GHGIA_T_3_9:activity_sets
        direct_diesel:
          selection_fields:
            PrimaryActivity:
              Passenger Cars Diesel On-Road: Passenger Cars - Households
              Medium- and Heavy-Duty Buses Diesel On-Road: Medium- and Heavy-Duty Buses
          attribution_method: direct

        petroleum_fuels_diesel:
          selection_fields:
            PrimaryActivity:
              Medium- and Heavy-Duty Trucks Diesel On-Road: Medium- and Heavy-Duty Trucks - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Trucks'

        light_duty_trucks_diesel:
          selection_fields:
            PrimaryActivity:
              Light-Duty Trucks Diesel On-Road: Light-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Diesel; Automobiles'

        petroleum_fuels_gasoline:
          selection_fields:
            PrimaryActivity:
              Passenger Cars Gasoline On-Road: Passenger Cars - Households
          attribution_method: direct

        light_duty_trucks_gasoline:
          selection_fields:
            PrimaryActivity:
              Light-Duty Trucks Gasoline On-Road: Light-Duty Trucks
          attribution_method: proportional
          attribution_source:
            Energy_highway_fuel_shares_national_2021:
              <<: *highway_fuel_shares
              selection_fields:
                Flowable: 'Gasoline; Automobiles'

    UMD_GHGIA_T_3_10: *mobile # N2O from mobile combustion duplicates method for CH4

    # Industrial distillate is almost all burned off-road by farms,
    # construction and mining. Weight it by each group's physical fuel volume
    # (EIA farm and off-highway sales, Economic Census mining diesel, MECS)
    # rather than by refinery purchases, which also carry the on-road truck
    # fuel attributed above. Motor gasoline keeps the facilities weighting.
    UMD_GHGIA_T_3_11: !include:GHG_national_Cornerstone_nowcast_facilities_2021.yaml:source_names:UMD_GHGIA_T_3_11
      activity_sets: !include:GHG_national_Cornerstone_nowcast_facilities_2021.yaml:source_names:UMD_GHGIA_T_3_11:activity_sets
        petroleum_use:
          selection_fields:
            PrimaryActivity:
              - Petroleum Industrial - Motor Gasoline
          attribution_method: proportional
          attribution_source:
            Nowcast_Detail_Use_AfterRedef:
              year: 2021
              activity_to_sector_mapping: Cornerstone_2025
              selection_fields:
                ActivityProducedBy: {'324110': ''}
              clean_fba: !script_function:EIA_MECS keep_industrial_petroleum_consumers
              attribution_method: equal

        petroleum_distillate:
          selection_fields:
            PrimaryActivity:
              - Petroleum Industrial - Distillate Fuel Oil
          attribution_method: proportional
          attribution_source:
            Energy_industrial_distillate_national_2021:
              data_format: FBS
              geoscale: national
