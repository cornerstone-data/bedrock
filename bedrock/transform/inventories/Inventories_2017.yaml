# Change in private inventories, 2017 - see Inventories_common.yaml
# for what every activity set is and why its lines were chosen.

!include:BEA_detail_commodity_target.yaml
year: &inv_year 2017
target_schema_year: 2017
geoscale: national
activity_schema: null

_attribution_sources:
  # Weights WITHIN a trade line's commodity set: what that kind of business
  # actually sells, from Economic Census product lines. Hill's merchandise-trade
  # rule is literally "what the industry sells", and BEA reaches for the same
  # data in its margin method.
  #
  # ⚠️ The product must move into an activity column before mapping.
  # activity_to_sector_mapping joins on the activity columns and never on
  # FlowName, and the product - not the industry - is what carries a BEA
  # commodity. Skipping this yields an empty weight set rather than an error.
  #
  # ⚠️ Suppression is recovered first. 54% of trade rows are withheld, though
  # only 4.3% of value; left at zero they would bias every share toward whatever
  # happens to be publishable.
  # Weights WITHIN a farm group: what each farm commodity SELLS, from ERS cash
  # receipts - the farm analogue of using PxI product-line sales for trade.
  #
  # ⚠️ Reaches BEA through a COMPOSED crosswalk. Sector_Crosswalk_USDA_ERS_FIWS
  # maps ERS commodities to NAICS 2012, not to BEA, so weighting a BEA target
  # with it attributes to -100%. Sector_Crosswalk_USDA_ERS_FIWS_BEA is that
  # mapping composed through NAICS_to_BEA_Crosswalk_2017, generated by
  # utils/mapping/write_fiws_bea_crosswalk.py.
  #
  # ⚠️ Cash RECEIPTS, not the inventory concept. The inventory series has only
  # two groups and they are already spent on the crops/livestock split, so
  # reusing them here would give every commodity in a group the same weight -
  # which is the equal allocation this replaces.
  #
  # ⚠️ Matched on PrimarySector alone. ERS's ActivityProducedBy is a commodity
  # name ('Corn'), while the target's is the group label split_farm_by_fiws_
  # inventory assigns ('Farm, crops'), so keying on both matches nothing.
  USDA_ERS_FIWS: &fiws_receipts
    year: 2017
    selection_fields:
      FlowName: ['Cash receipts value', 'Cash receipt value']
    activity_to_sector_mapping: USDA_ERS_FIWS_BEA
    attribution_method: direct

  Census_EC_PxI: &pxi_weights
    # ⚠️ `year` is the census VINTAGE to load and must stay 2017;
    # `target_year` is the year whose product mix is wanted. The
    # weights are interpolated between the 2017 and 2022 vintages
    # and held after - Census_EC.pxi_weights_for_year.
    year: 2017
    target_year: *inv_year
    # ⚠️ Must be overridden here. Without it the source inherits the METHOD's
    # schema - activity_schema: {'bea': ...} - and map_to_sectors then treats
    # activity values as BEA codes and expands them through the BEA hierarchy.
    # These activities are product descriptions like 'cementing oil and gas
    # wells', so nothing matches, mapping returns 0 rows, and the attribution
    # merge finds an empty right-hand side. The 27,874 rows in, 0 out was the
    # whole failure.
    activity_schema: null
    # ⚠️ One hook, not two. prepare_fbs runs clean_fba_before_mapping BEFORE
    # estimate_suppressed, which is the opposite of the order these need - see
    # prepare_pxi_for_attribution.
    clean_fba_before_mapping: !script_function:Census_EC prepare_pxi_for_attribution
    activity_to_sector_mapping: Census_EC_PxI
    # ⚠️ Required, and not merely a hint. After the product moves,
    # ActivityProducedBy is null on every row and the product sits in
    # ActivityConsumedBy. Without this, add_primary_secondary_columns falls into
    # its _identify_secondary branch, which calls apply(axis='columns') - and on
    # a frame that machinery has narrowed to empty, apply returns a DataFrame
    # rather than a Series, so pandas raises "Cannot set a DataFrame with
    # multiple columns to the single column SecondarySector". Naming the primary
    # column assigns Primary/Secondary directly and never reaches that apply.
    primary_action_type: Consumed
    # ⚠️ Also declared here, not only on the activity sets. flowby reads it from
    # `(attribution_config or self.config)`, so the SOURCE's config wins - and
    # without it here the lookup returns [], retain_activity_columns stays False,
    # ActivityProducedBy is dropped before the join, and every key arrives as
    # ('<sector>', 'N/A', '00000'). That matches nothing and each trade set
    # reports a 100% loss.
    attribute_on: ['PrimarySector', 'ActivityProducedBy']
    attribution_method: direct

source_names:
  BEA_NIPA:
    geoscale: national
    year: *inv_year
    data_format: FBA
    clean_fba_before_activity_sets: !script_function:BEA_NIPA extract_table_info
    clean_fba_w_sec: !script_function:BEA_NIPA drop_unassigned

    activity_sets:
      inventories_farm: !include:Inventories_common.yaml:activity_sets:inventories_farm
        attribution_source:
          USDA_ERS_FIWS: *fiws_receipts
      inventories_manufacturing: !include:Inventories_common.yaml:activity_sets:inventories_manufacturing
        attribution_source:
          Census_EC_PxI: *pxi_weights
      inventories_wholesale_merchant: !include:Inventories_common.yaml:activity_sets:inventories_wholesale_merchant
        attribution_source:
          Census_EC_PxI: *pxi_weights
      inventories_wholesale_nonmerchant_durable: !include:Inventories_common.yaml:activity_sets:inventories_wholesale_nonmerchant_durable
        attribution_source:
          Census_EC_PxI: *pxi_weights
      inventories_wholesale_nonmerchant_nondurable: !include:Inventories_common.yaml:activity_sets:inventories_wholesale_nonmerchant_nondurable
        attribution_source:
          Census_EC_PxI: *pxi_weights
      inventories_mining_utilities_construction: !include:Inventories_common.yaml:activity_sets:inventories_mining_utilities_construction
        attribution_source:
          Census_EC_PxI: *pxi_weights
      inventories_retail: !include:Inventories_common.yaml:activity_sets:inventories_retail
        attribution_source:
          Census_EC_PxI: *pxi_weights
      inventories_other: !include:Inventories_common.yaml:activity_sets:inventories_other
