# How much of highway gasoline or diesel each sector uses, by vehicle class.
# Flowables:
#   Gasoline; Automobiles, Gasoline; Buses, Gasoline; Trucks,
#   Diesel; Automobiles, Diesel; Buses, Diesel; Trucks.
# FlowAmount is a share (sums to 1 within each Flowable).

!include:Cornerstone_2025_target.yaml
year: &year 2024
geoscale: national

# Nonpublic landings by MV-7 vehicle class
_nonpublic_sectors: &nonpublic_sectors
  Trucks: ['484']
  Automobiles: ['F01000', '492']
  Buses: ['485', '487']

source_names:
  FHWA_Highway_Statistics:
    year: *year
    activity_to_sector_mapping: FHWA
    selection_fields:
      Description: Table MF-21
      FlowName:
        - Gasoline highway
        - Special fuel highway
      ActivityConsumedBy:
        - Federal Civilian
        - State, County and Municipal
        - Private and Commercial
    activity_sets:
      gasoline:
        selection_fields:
          FlowName: Gasoline highway
          ActivityConsumedBy:
            - Federal Civilian
            - Private and Commercial
            - State, County and Municipal
        attribution_method: direct
        clean_fba_after_attribution: !script_function:FHWA highway_fuel_shares
        clean_parameter:
          flowable: Gasoline
          ffr_fuels: [Gasoline]
          nonpublic_source: mf21
          nonpublic_sectors: *nonpublic_sectors
          use_commodity_for_sector_weights: &use_commodity_for_sector_weights '324110'
          ffr: &highway_ffr
            source_name: GSA_FFR
            year: *year
          use: &highway_use
            source_name: Nowcast_Detail_Use_AfterRedef
            year: *year
          mv7: &highway_mv7
            source_name: FHWA_Highway_Statistics
            year: *year
            selection_fields:
              Description: Table MV-7
              FlowName:
                - Automobiles
                - Buses
                - Trucks
          mv10: &highway_mv10
            source_name: FHWA_Highway_Statistics
            year: *year
            selection_fields:
              Description: Table MV-10
              FlowName: Buses
          mf21:
            source_name: FHWA_Highway_Statistics
            year: *year
            selection_fields:
              Description: Table MF-21
              FlowName: Gasoline highway

      diesel:
        selection_fields:
          FlowName: Special fuel highway
        attribution_method: direct
        clean_fba_after_attribution: !script_function:FHWA highway_fuel_shares
        clean_parameter:
          flowable: Diesel
          ffr_fuels:
            - Diesel
            - Biodiesel (B20)
            - Biodiesel (B100)
            - Renewable Diesel
          # Private and Commercial gallons from this activity set's attributed FBA
          nonpublic_source: attributed_nonpublic
          nonpublic_sectors: *nonpublic_sectors
          use_commodity_for_sector_weights: *use_commodity_for_sector_weights
          ffr: *highway_ffr
          use: *highway_use
          mv7: *highway_mv7
          mv10: *highway_mv10
