# How much of highway gasoline or diesel each sector uses, by vehicle class.
# Flowables:
#   Gasoline; Automobiles, Gasoline; Buses, Gasoline; Trucks,
#   Diesel; Automobiles, Diesel; Buses, Diesel; Trucks.
# FlowAmount is a share (sums to 1 within each Flowable).

!include:Cornerstone_2025_target.yaml
year: &year 2024
geoscale: national

_attribution_sources:
  Nowcast_use: &nowcast_use
    year: *year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    attribution_method: equal

source_names:
  FHWA_Highway_Statistics:
    year: *year
    activity_to_sector_mapping: FHWA
    selection_fields:
      Description: Table MF-21
      FlowName:
        - Gasoline highway
        - Special fuel highway
      ActivityConsumedBy:
        - Federal Civilian
        - State, County and Municipal
        - Private and Commercial
    activity_sets:
      gasoline:
        selection_fields:
          FlowName: Gasoline highway
          ActivityConsumedBy:
            - Federal Civilian
            - Private and Commercial
            - State, County and Municipal
        clean_fba: !script_function:FHWA highway_fuel_shares
        clean_parameter:
          flowable: Gasoline
          ffr_fuels: [Gasoline]
          nonpublic_source: mf21
          ffr: &highway_ffr
            source_name: GSA_FFR
            year: *year
          mv7: &highway_mv7
            source_name: FHWA_Highway_Statistics
            year: *year
            selection_fields:
              Description: Table MV-7
              FlowName:
                - Automobiles
                - Buses
                - Trucks
          mv10: &highway_mv10
            source_name: FHWA_Highway_Statistics
            year: *year
            selection_fields:
              Description: Table MV-10
              FlowName: Buses
          mf21:
            source_name: FHWA_Highway_Statistics
            year: *year
            selection_fields:
              Description: Table MF-21
              FlowName: Gasoline highway
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast_use
            selection_fields:
              ActivityProducedBy: {'324110': ''}

      diesel:
        selection_fields:
          FlowName: Special fuel highway
        clean_fba: !script_function:FHWA highway_fuel_shares
        clean_parameter:
          flowable: Diesel
          ffr_fuels:
            - Diesel
            - Biodiesel (B20)
            - Biodiesel (B100)
            - Renewable Diesel
          # Private and Commercial gallons from this activity set's FBA
          nonpublic_source: attributed_nonpublic
          ffr: *highway_ffr
          mv7: *highway_mv7
          mv10: *highway_mv10
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast_use
            selection_fields:
              ActivityProducedBy: {'324110': ''}
