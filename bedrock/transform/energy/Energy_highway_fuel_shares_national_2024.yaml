# National highway gasoline / diesel sector shares (Unit=share).
# Per vehicle class (FlowName=Automobiles|Buses|Trucks; Flowable=Gasoline|Diesel):
#   Autos/Trucks — Method C (FFR fuel × MV-7 SCM/fed stock) + MF-21 private
#   Buses — MV-10 private / federal / SCM bus registrations (no 491; USPS
#     has no buses); federal → S00600
# SCM sector nest: Nowcast Use of 324110.

!include:Cornerstone_2025_target.yaml
year: &year 2024
geoscale: national

_attribution_sources:
  Nowcast_Detail_Use_AfterRedef: &nowcast_use
    year: *year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    attribution_method: equal

source_names:
  FHWA_Highway_Statistics:
    year: *year
    activity_to_sector_mapping: FHWA
    selection_fields:
      Description: Table MF-21
      FlowName:
        - Gasoline highway
        - Special fuel highway
      ActivityConsumedBy:
        - Federal Civilian
        - State, County and Municipal
        - Private and Commercial
    activity_sets:
      gasoline:
        selection_fields:
          FlowName: Gasoline highway
          ActivityConsumedBy:
            - Federal Civilian
            - Private and Commercial
            - State, County and Municipal
        attribution_method: direct
        clean_fba_after_attribution: !script_function:FHWA gasoline_highway_fuel_shares
        clean_source:
          GSA_FFR:
            year: *year
          FHWA_Highway_Statistics:
            year: *year
            selection_fields:
              Description: Table MF-21
              FlowName: Gasoline highway
          FHWA_Highway_Statistics_MV7:
            year: *year
            selection_fields:
              Description: Table MV-7
              FlowName:
                - Automobiles
                - Buses
                - Trucks
          FHWA_Highway_Statistics_MV10:
            year: *year
            selection_fields:
              Description: Table MV-10
              FlowName: Buses
          Nowcast_Detail_Use_AfterRedef:
            year: *year

      diesel:
        selection_fields:
          FlowName: Special fuel highway
        attribution_method: direct
        clean_fba_after_attribution: !script_function:FHWA diesel_highway_fuel_shares
        clean_source:
          GSA_FFR:
            year: *year
          FHWA_Highway_Statistics_MV7:
            year: *year
            selection_fields:
              Description: Table MV-7
              FlowName:
                - Automobiles
                - Buses
                - Trucks
          FHWA_Highway_Statistics_MV10:
            year: *year
            selection_fields:
              Description: Table MV-10
              FlowName: Buses
          Nowcast_Detail_Use_AfterRedef:
            year: *year
