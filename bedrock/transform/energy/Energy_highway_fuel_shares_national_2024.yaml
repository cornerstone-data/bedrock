# How much of highway gasoline or diesel each sector uses, by vehicle class.
# Flowables:
#   Gasoline; Automobiles, Gasoline; Buses, Gasoline; Trucks,
#   Diesel; Automobiles, Diesel; Buses, Diesel; Trucks.
# FlowAmount is a share (sums to 1 within each Flowable).

!include:Cornerstone_2025_target.yaml
year: &year 2024
geoscale: national

_attribution_sources:
  Nowcast_Detail_Use_AfterRedef: &nowcast_use
    year: *year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    attribution_method: equal

# Nonpublic landings by MV-7 vehicle class
_nonpublic_sectors: &nonpublic_sectors
  Trucks: ['484']
  Automobiles: ['F01000', '492']
  Buses: ['485', '487']

_highway_clean_source: &highway_clean_source
  GSA_FFR:
    year: *year
  FHWA_Highway_Statistics_MV7:
    year: *year
    selection_fields:
      Description: Table MV-7
      FlowName:
        - Automobiles
        - Buses
        - Trucks
  FHWA_Highway_Statistics_MV10:
    year: *year
    selection_fields:
      Description: Table MV-10
      FlowName: Buses
  Nowcast_Detail_Use_AfterRedef:
    year: *year

source_names:
  FHWA_Highway_Statistics:
    year: *year
    activity_to_sector_mapping: FHWA
    selection_fields:
      Description: Table MF-21
      FlowName:
        - Gasoline highway
        - Special fuel highway
      ActivityConsumedBy:
        - Federal Civilian
        - State, County and Municipal
        - Private and Commercial
    activity_sets:
      gasoline:
        selection_fields:
          FlowName: Gasoline highway
          ActivityConsumedBy:
            - Federal Civilian
            - Private and Commercial
            - State, County and Municipal
        attribution_method: direct
        clean_fba_after_attribution: !script_function:FHWA highway_fuel_shares
        clean_parameter:
          flowable: Gasoline
          ffr_fuels: [Gasoline]
          nonpublic_source: mf21
          nonpublic_sectors: *nonpublic_sectors
        clean_source:
          <<: *highway_clean_source
          FHWA_Highway_Statistics:
            year: *year
            selection_fields:
              Description: Table MF-21
              FlowName: Gasoline highway

      diesel:
        selection_fields:
          FlowName: Special fuel highway
        attribution_method: direct
        clean_fba_after_attribution: !script_function:FHWA highway_fuel_shares
        clean_parameter:
          flowable: Diesel
          ffr_fuels:
            - Diesel
            - Biodiesel (B20)
            - Biodiesel (B100)
            - Renewable Diesel
          nonpublic_source: attributed
          nonpublic_sectors: *nonpublic_sectors
        clean_source:
          <<: *highway_clean_source
