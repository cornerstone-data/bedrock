# Manufacturing energy FBS for GHG nowcast inventory year 2022.
# MECS anchor 2022 + prior 2018 flat+λ annual path (#1210); Use split census 2022.
# Replicates CEDA allocation steps as quantity weights: MECS mapped with
# parent-incomplete-child + Cornerstone_2025

!include:Cornerstone_2025_target.yaml
year: &use_year 2022
mecs_anchor_year: &mecs_anchor_year 2022
mecs_prior_year: &mecs_prior_year 2018
# Alias for transport/UMD refs that previously tracked the MECS survey year.
mecs_year: &mecs_year 2022
# Census Use that splits MECS parents (#1053 / #1210): locked to 2022 with the
# MECS 2022 anchor (no 2017→2022 cliff at inventory 2021).
split_year: &split_year 2022
geoscale: national

_attribution_sources:
  Nowcast_use: &nowcast_use
    year: *split_year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      # Match GHG nowcast Use attribution (FD columns only)
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    attribution_method: equal

# Shared by MECS activity cleans + petrol Other fraction (#1210).
_mecs_annual_path: &mecs_annual_path
  inventory_year: *use_year
  anchor_year: *mecs_anchor_year
  prior_year: *mecs_prior_year

source_names:
  EIA_MECS_Energy:
    year: *mecs_anchor_year
    activity_to_sector_mapping: Cornerstone_2025
    selection_fields:
      Location: &mecs_location '00000'
      Description: [Table 2.1, Table 3.1]
    exclusion_fields: &mecs_excl
      ActivityConsumedBy: '31-33'
    clean_fba_before_activity_sets:
      # Suppressed feedstock cells from the other survey x GHGRP (#1200)
      - !script_function:EIA_MECS fill_suppressed_mecs_feedstock_with_ghgrp
      - !script_function:EIA_MECS estimate_suppressed_mecs_energy
    activity_sets:
      table_3_1_coal:
        selection_fields: &mecs_t31_coal
          Description: Table 3.1
          FlowName: Coal
        clean_fba: !script_function:EIA_MECS apply_mecs_annual_share_path
        clean_source:
          EIA_MECS_Energy:
            year: *mecs_prior_year
            selection_fields:
              Location: *mecs_location
              <<: *mecs_t31_coal
            exclusion_fields: *mecs_excl
        clean_parameter: *mecs_annual_path
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast_use
            selection_fields:
              ActivityProducedBy: {'212100': ''}
      table_3_1_ng:
        selection_fields: &mecs_t31_ng
          Description: Table 3.1
          FlowName: Natural Gas
        clean_fba: !script_function:EIA_MECS apply_mecs_annual_share_path
        clean_source:
          EIA_MECS_Energy:
            year: *mecs_prior_year
            selection_fields:
              Location: *mecs_location
              <<: *mecs_t31_ng
            exclusion_fields: *mecs_excl
        clean_parameter: *mecs_annual_path
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast_use
            selection_fields:
              ActivityProducedBy: {'221200': ''}
      table_2_1:
        selection_fields: &mecs_t21
          Description: Table 2.1
          FlowName:
            'Hydrocarbon Gas Liquids, excluding natural gasoline': HGL
            Other: Petroleum
        clean_fba: !script_function:EIA_MECS apply_mecs_annual_share_path
        clean_source:
          EIA_MECS_Energy:
            year: *mecs_prior_year
            selection_fields:
              Location: *mecs_location
              <<: *mecs_t21
            exclusion_fields: *mecs_excl
        clean_parameter: *mecs_annual_path
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast_use
            selection_fields:
              ActivityProducedBy: {'324110': ''}
      table_2_1_ng:
        selection_fields: &mecs_t21_ng
          Description: Table 2.1
          FlowName: Natural Gas
        clean_fba:
          - !script_function:EIA_MECS keep_chemical_manufacturing
          - !script_function:EIA_MECS apply_mecs_annual_share_path
        clean_source:
          EIA_MECS_Energy:
            year: *mecs_prior_year
            selection_fields:
              Location: *mecs_location
              <<: *mecs_t21_ng
            exclusion_fields: *mecs_excl
        clean_parameter: *mecs_annual_path
        attribution_method: proportional
        attribution_source:
          Nowcast_Detail_Use_AfterRedef:
            <<: *nowcast_use
            selection_fields:
              ActivityProducedBy: {'221200': ''}

  Nowcast_Detail_Use_AfterRedef:
    year: *use_year
    activity_to_sector_mapping: Cornerstone_2025
    exclusion_fields:
      ActivityConsumedBy: ['F03000', 'F04000', 'F05000', 'F02E00',
                           'F06E00', 'F07E00', 'F10E00', 'F02R00']
    activity_sets:
      petrol:
        selection_fields:
          ActivityProducedBy: {'324110': ''}
        exclusion_fields:
          ActivityConsumedBy: ['481000', '482000', '483000', '484000',
            '485000', '486000', '48A000', '492000', 'S00500', 'S00600',
            '491000', 'GSLGO', 'S00203', 'F01000']
        assign_fields:
          FlowName: Petroleum
          Class: Money
        clean_fba: !script_function:EIA_MECS keep_industrial_petroleum_consumers
        clean_source:
          EIA_MECS_Energy:
            year: *mecs_anchor_year
            selection_fields:
              Location: *mecs_location
              FlowName: Other
              Description: [Table 2.1, Table 3.1]
            exclusion_fields: *mecs_excl
            estimate_suppressed: !script_function:EIA_MECS estimate_suppressed_mecs_energy
        clean_parameter: *mecs_annual_path
        clean_fba_after_attribution: !script_function:EIA_MECS multiply_bea_by_mecs_petroleum_energy_fraction
        attribution_method: direct
      neu_coal_coke:
        selection_fields:
          ActivityConsumedBy: '2122A0'
        exclusion_fields:
          ActivityProducedBy: '324110'
        assign_fields:
          FlowName: Coal and Coke
          Class: Other
        attribution_method: direct
      neu_transport:
        selection_fields:
          ActivityProducedBy: {'324110': ''}
          ActivityConsumedBy: ['481000', '482000', '483000',
            '484000', '485000', '486000', '48A000', '492000',
            'S00500', 'S00600', '491000', 'GSLGO', 'S00203', 'F01000']
        assign_fields:
          FlowName: Transport
          Class: Money
        clean_source:
          UMD_GHGIA_T_A5_1_S6:
            year: *mecs_year
            selection_fields:
              Unit: TBtu
              ActivityConsumedBy: Residential
              FlowName:
                - Kerosene
                - LPG (Propane)
                - Distillate Fuel Oil
        clean_parameter:
          year: *mecs_year
          pce:
            extract_input: BEA_PCE
            file: BEA Personal Consumption Expenditures by Major Type of Product_June27_2024.csv
            skiprows: 3
            index_col: 1
            drop_columns: [Line]
            line: Gasoline and other energy goods
          propane_price:
            extract_input: EIA_EnergyPrice
            file: U.S._Propane_Residential_Price.csv
            skiprows: 4
            month_column: Month
            value_column: U.S. Propane Residential Price Dollars per Gallon
          heating_oil_price:
            extract_input: EIA_EnergyPrice
            file: U.S._No._2_Heating_Oil_Residential_Price.csv
            skiprows: 4
            month_column: Month
            value_column: U.S. No. 2 Heating Oil Residential Price Dollars per Gallon
          residential_heat_fuels:
            propane_priced: [Kerosene, LPG (Propane)]
            heating_oil_priced: [Distillate Fuel Oil]
        clean_fba_after_attribution: !script_function:EIA_MECS scale_household_petroleum_to_transport_share
        attribution_method: direct
