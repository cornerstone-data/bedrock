author: US Census Bureau
source_name: Annual Integrated Economic Survey, Waste Child Total Expenses
source_url: https://www.census.gov/programs-surveys/aies.html
source_publication_date: 2025
bib_id: Census_AIES_Waste_Child_Expenses

# Industry-mix successor to SAS Table 3 for waste NAICS children:
# EXPS_TOT_DVAL at 6-digit 562*. 2023 uses AIES00EXP01 (aiesexp01);
# 2024 folds the same total into AIES00BASIC (aiesbasic) — EXP01 is not
# published for 2024. Do NOT use aiesexp02 / Service_Expenses (aggregate 562
# only) or EXPS_REFUSE_VAL (purchaser refuse).
api_name: Census
api_key_required: true
format: json
url:
  base_url: https://api.census.gov/data/
  api_path: __year__/aiesbasic?
  url_params:
    get: NAICS2017,EXPS_TOT_DVAL
    for: "us:*"
    key: __apiKey__
  key_param: key

url_replace_fxn: !script_function:Census_AIES census_aies_waste_child_expenses_url_helper
call_response_fxn: !script_function:Census_AIES census_aies_call
parse_response_fxn: !script_function:Census_AIES census_aies_waste_child_expenses_parse

years:
- 2023
- 2024
