author: US Census Bureau
source_name: Annual Wholesale Trade Survey (AWTS)
source_url: https://www.census.gov/programs-surveys/awts.html
source_publication_date: 2024
bib_id: Census_AWTS
api_name: None
api_key_required: false
format: xlsx
url:
  # Table 4, purchases and gross margins, merchant wholesalers excluding
  # manufacturers' sales branches and offices. Other tables are listed at
  # https://www.census.gov/data/tables/2022/econ/awts/annual-reports.html
  base_url: https://www2.census.gov/programs-surveys/awts/tables/2022/2022_awts_purchmarg_nomsbo_table4.xlsx

call_response_fxn: !script_function:Census_AWTS census_awts_call
parse_response_fxn: !script_function:Census_AWTS census_awts_parse

# The 2022 vintage publishes every year back to 1992 as columns, so the workbook
# is read once and each year selected out of it rather than fetched separately.
call_all_years: True

# 2012 is where the nowcast's interest starts; 2022 is where AWTS itself stops.
# The annual economic surveys were consolidated into the Annual Integrated
# Economic Survey from data year 2023, so Census_AIES carries 2023 onward.
years:
- 2012
- 2013
- 2014
- 2015
- 2016
- 2017
- 2018
- 2019
- 2020
- 2021
- 2022
