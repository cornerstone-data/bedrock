author: US Census Bureau
source_name: Annual Integrated Economic Survey, Expenses by Kind
source_url: https://www.census.gov/programs-surveys/aies.html
source_publication_date: 2025
bib_id: Census_AIES_Expenses

# **The 2023 end of the annual materials panel.** `Census_ASM_Expenses` carries
# manufacturing's cost of materials, fuels, electricity, contract work and
# resales for 2018-2021; AIES is the survey that replaced ASM from data year
# 2023 and publishes the same decomposition under new names. Together with the
# two Economic Census vintages they give the only observed path between the 2017
# and 2022 materials breakouts, and past 2022.
#
# ✅ **The scope splices cleanly onto ASM.** `EXPS_MAT_DVAL` is ASM's `CSTMPRT`
# and `EXPS_FUEL_VAL` its `CSTFU`, so the `Census_EC_MatFuel`-matched scope is
# `EXPS_MAT_DVAL + EXPS_FUEL_VAL` = **$3,517.5B in 2023**, against $3,772B for
# the 2022 census and $3,109B for ASM 2021. Verified additive: the five cost
# cells sum to the published `EXPS_CSTMTOT_DVAL` control at 99.77% in aggregate,
# median per-industry ratio 1.0000, within 1% for 324 of 360 industries.
#
# ⚠️ **The expense detail in THIS pull is manufacturing only** - because this
# pull reads `timeseries/aies/basic`, where every service row comes back a
# **well-formed zero**. ❌ **An earlier draft read that as "21, 22, 23 and 51-81
# publish nothing at all" and generalised it to the survey. That is wrong.**
# `timeseries/aies/exp02` (group `AIES00EXP02`, *Detailed Operating Expenses*)
# publishes all 41 expense variables for **13 service sectors** in 2023 - 22,
# 48, 49, 51, 52, 53, 54, 56, 61, 62, 71, 72, 81. Purchased electricity is
# $50.3B for sector 22. See analysis/nowcasting/service_expense_resource.py.
#
# ⚠️ **Wholesale and retail are absent from `exp02` entirely** - no 42, 44 or 45
# rows, not zeros - and `ecnbasic` populates the expense variables for sectors
# 21, 23 and 31-33 only, in both 2017 and 2022. The trade counterpart is the
# AWTS/ARTS Business Expenses Supplement, rejected in #705 on suppression.
#
# ⚠️ **No mining.** `Census_EC_MatFuel` covers NAICS sector 21 as well as 31-33;
# this covers 31-33 only, so the 2023 observation is narrower than the census
# years it extends.
#
# ⚠️ **2023 is the only year that answers.** 2022 predates the consolidated
# survey and 2024 is not published yet; both return `204 No Content`. The annual
# materials panel is therefore census 2017, ASM 2018-2021, census 2022, AIES
# 2023, and the estimation span ends there. Adding 2024 once it publishes is
# cornerstone-data/bedrock#707, Phase 2 work tied to a 2024 table; 2025 is out
# of scope.
#
# ⚠️ **Every NAICS level is kept**, including the `31-33` rollup, which is five
# characters and survives a `len == 5` filter. Match `^\d+$` first, then filter
# on length, or the table multiplies.
#
# ⚠️ **Amounts are Thousand USD.**
#
# ⚠️ **No `source_catalog.yaml` entry yet**, on the same reasoning as
# `Census_ASM_Expenses`: nothing attributes this to sectors, it is read directly
# by analysis/nowcasting/inputs_structure.py. Write a real entry when the
# first FBS consumes it - `return_true_source_catalog_name` would otherwise fall
# back to `Census_AIES`, whose schema describes the trade-margin pull.
api_name: Census

# ⚠️ **AIES is published as per-year datasets, not as a timeseries.** The
# `timeseries/aies/basic` path this source used until 2026-09 now returns 404 for
# EVERY year, 2023 included. The live path is `data/<year>/<dataset>`, and it
# names the industry column NAICS2017 rather than NAICS - census_aies_call
# renames it back so the parse is unchanged.
#
# ⚠️ **2024 retires four expense variables** - purchased communication
# services, expensed software, and the building and machinery rental lines,
# which 2024 replaces with one combined rent figure. Census rejects an unknown
# variable outright rather than returning it empty, so a 2024 request naming
# them fails the whole pull; census_aies_expenses_url_helper drops them per
# year. Taking the combined rent line needs a building/machinery split rule
# and is deliberately left for later.
api_key_required: true
format: json
url:
  base_url: https://api.census.gov/data/
  api_path: __year__/aiesbasic?
  url_params:
    get: NAICS2017,EXPS_CSTMTOT_DVAL,EXPS_MAT_DVAL,EXPS_FUEL_VAL,EXPS_ELEC_VAL,EXPS_CONTRACT_VAL,EXPS_RESALE_VAL,EXPS_TOT_DVAL,EXPS_ADVERT_VAL,EXPS_COMMSVC_VAL,EXPS_DATAPROC_VAL,EXPS_PROFTECH_VAL,EXPS_TEMPSTAF_VAL,EXPS_REFUSE_VAL,EXPS_MACH_REP_VAL,EXPS_BUILD_REP_VAL,EXPS_RENT_BUILD_VAL,EXPS_RENT_MACH_VAL,EXPS_EXSOFT_VAL,EXPS_COMPTR_OTHEQ_VAL,RCPT_TOT_VAL
    for: "us:*"
    key: __apiKey__
  key_param: key

url_replace_fxn: !script_function:Census_AIES census_aies_expenses_url_helper
call_response_fxn: !script_function:Census_AIES census_aies_call
parse_response_fxn: !script_function:Census_AIES census_aies_expenses_parse

years:
- 2023
- 2024
