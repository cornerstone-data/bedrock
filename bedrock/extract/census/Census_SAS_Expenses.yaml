author: US Census Bureau
source_name: Service Annual Survey, Selected Expenses
source_url: https://www.census.gov/programs-surveys/sas.html
source_publication_date: 2024
bib_id: Census_SAS_Expenses

# **Table 5, "Estimated Selected Expenses for Employer Firms", spliced across two
# SAS vintages.** The service-sector counterpart to `Census_ASM_Expenses`, and
# the reason it is a separate source from `Census_SAS` is in that module's
# docstring: Tables 2, 3 and 8 publish their whole history in the latest
# workbook and **Table 5 does not**, so the 2017 vintage has to be read as well.
#
# ✅ **63 industries at 2- to 4-digit NAICS**, ~35 expense items, ~19 of them
# mappable to a BEA commodity, reaching 38-72% of the columns they describe.
# This is the source #564 recorded as "one row for the entire sector" - that is
# true of AIES `exp02` in 2023 and false of SAS.
#
# ⚠️ **2018 and 2019 publish none of the general purchased-input cells.** The
# sheet exists for them in both vintages but carries only payroll, temporary
# staff, depreciation and the sector-specific items, so the years are omitted
# below rather than generated empty.
#
# ⚠️ **The two vintages sit on different Economic Census benchmarks** - 2012 for
# `sas-17`, 2017 for `sas-22` - and no restated 2017 exists, because the
# detailed-expense series restarts at 2020. A ratio across that gap carries a
# rebenchmark. The benchmark is written into `Description` on every row so the
# seam is visible in the FBA rather than only in this comment. #705 scored a
# seed built across it and it loses to a frozen 2017 column for every service
# column except `ORE`; see
# `analysis/nowcasting/intermediate_estimation_plan.md` §Sourcing the columns
# that actually drift before using this for anything but `ORE`.
#
# ⚠️ **Three mappable items were discontinued after 2017** - lease and rental
# payments for machinery, purchased communication services, and water/sewer/
# refuse removal - so the item sets differ across the seam as well as the
# benchmarks. Intersect the items before differencing two years.
#
# ⚠️ **Amounts are millions of dollars.** Every Census *API* source in this
# directory publishes thousands; this one is a published workbook and does not.
#
# ⚠️ **Every NAICS level is published**, 2- through 6-digit, and each parent
# covers its children. Filter before summing.
#
# ⚠️ **No `source_catalog.yaml` entry yet**, on the same reasoning as
# `Census_ASM_Expenses` - nothing attributes this to sectors, it is read
# directly by `analysis/nowcasting/inputs_structure.py`. Inheriting
# `Census_SAS`'s entry would be wrong, because that source carries revenue
# activities as well as expense ones.
api_name: None
api_key_required: false
format: xlsx
url:
  # Unused: every vintage carries its whole url in the block below, because the
  # two workbooks are not in the same directory on www2.census.gov.
  base_url: https://www2.census.gov/programs-surveys/sas/tables/time-series/sas-latest/

# One entry per published vintage, keyed by the workbook filename - which is
# also the cache name and what the url helper and the loader key on. Adding a
# vintage is an entry here plus its years below; nothing in the module changes.
vintages:
  sas-17.xlsx:
    # ⚠️ Under `services/`, not `sas/`. Census moved the directory between
    # releases and left the older vintages where they were.
    url: https://www2.census.gov/programs-surveys/services/tables/time-series/sas-latest/sas-17.xlsx
    benchmark: 2012 Economic Census
  sas-22.xlsx:
    url: https://www2.census.gov/programs-surveys/sas/tables/time-series/sas-latest/sas-22.xlsx
    benchmark: 2017 Economic Census

url_replace_fxn: !script_function:Census_SAS_Expenses census_sas_expenses_url_helper
call_response_fxn: !script_function:Census_SAS_Expenses census_sas_expenses_call
gcs_fxn: !script_function:Census_SAS_Expenses census_sas_expenses_load_gcs
parse_response_fxn: !script_function:Census_SAS_Expenses census_sas_expenses_parse

# Read the cached workbooks from extract/input_data/Census_SAS_Expenses/ (or GCS
# extract-input if not cached yet) rather than re-downloading every run. Set to
# True to refresh from Census, then upload the new files.
extract_data_from_raw_sources: False

# Both vintages are read once and each year selected out of the result.
call_all_years: True

# ⚠️ 2018 and 2019 are deliberately absent - see the note above. 2012 is where
# the nowcast's interest starts and 2013 is where Table 5's item detail does;
# 2022 is where SAS itself stops, after which the annual economic surveys were
# consolidated into the Annual Integrated Economic Survey.
years:
  - 2013
  - 2014
  - 2015
  - 2016
  - 2017
  - 2020
  - 2021
  - 2022
