author: Surface Transportation Board
source_name: Commodity Revenue Stratification Report (CRSR)
source_url: https://www.stb.gov/reports-data/economic-data/commodity-revenue-stratification-reports/
source_publication_date: 2025
bib_id: STB_CRSR
api_name: None
api_key_required: false
format: xlsx

# The 5-digit report, one row per (STCC5, car type). The 2-digit companion
# (CRSR2) has only 37 groups - "Chemical Products" alone is 15% of rail revenue
# - which is too coarse to reach BEA detail commodities.
#
# URLs are irregular across years: 2020 onward sit at the site root, earlier
# years under econdata/, and 2015-2016 carry a random numeric suffix. The helper
# resolves the link off the published index instead of constructing it, so a
# newly released year needs no code change.
url:
  base_url: https://www.stb.gov/reports-data/economic-data/commodity-revenue-stratification-reports/
url_replace_fxn: !script_function:STB_CRSR stb_crsr_url_helper
call_response_fxn: !script_function:STB_CRSR stb_crsr_call
gcs_fxn: !script_function:STB_CRSR stb_crsr_load_gcs
parse_response_fxn: !script_function:STB_CRSR stb_crsr_parse

# Read the workbook from extract/input_data/STB_CRSR/{year}/ (or GCS
# extract-input if it is not cached yet) rather than re-scraping the STB index
# every run. That matters more here than for most sources: the download URL is
# resolved off an index page rather than constructed, and STB has already
# reorganised these files twice. Caching also pins the 2017 anchor against
# revisions to the waybill sample.
#
# Set to True to refresh the cache from the STB, e.g. when a new year is
# published, then upload the new file so others need not.
extract_data_from_raw_sources: False

# One workbook per year, so each year is fetched separately.
call_all_years: False

# STB publishes 2010 onward, but this starts at 2017: that is the margins
# anchor, and nothing in the nowcast window reaches further back.
#
# ⚠️ 2014 and 2015 use a different sheet layout - 17 columns with an extra
# leading column, and no banner rows - so the parser here rejects them rather
# than misreading them. 2012, 2013 and 2016 do parse. Adding any of them means
# a second layout branch, not just a years: entry.
#
# 2024 is published, which makes rail the only transport mode with an observed
# final nowcast year: SAS, AIES and the trade surveys all stop earlier.
years:
- 2017
- 2018
- 2019
- 2020
- 2021
- 2022
- 2023
- 2024
