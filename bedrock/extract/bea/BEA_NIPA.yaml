author: US Bureau of Economic Analysis
source_name: National Income and Product Accounts
source_url: https://www.bea.gov/itable/national-gdp-and-personal-income
bib_id: BEA_NIPA
url:
  base_url: https://apps.bea.gov/national/Release/TXT/FlatFiles.ZIP
files:
- nipadataA.txt
- SeriesRegister.txt
- TablesRegister.txt

call_response_fxn: !script_function:BEA_NIPA bea_nipa_call
gcs_fxn: !script_function:BEA_NIPA bea_nipa_load_gcs
parse_response_fxn: !script_function:BEA_NIPA bea_nipa_parse

# Read FlatFiles.ZIP from extract/input_data/BEA_NIPA/ (or GCS extract-input if
# it is not cached yet) rather than re-downloading ~19MB from BEA every run.
# Set to True to refresh the cache from the BEA url, e.g. after a NIPA release.
extract_data_from_raw_sources: False

call_all_years: True

tables:
- U20405      # Table 2.4.5U. Personal Consumption Expenditures by Type of Product
- T30500      # Table 3.5 Taxes on Production and Imports
- T30905      # Table 3.9.5. Government Consumption Expenditures and Gross Investment
- T31300      # Table 3.13. Subsidies
- U50405      # Table 5.4.5U. Private Fixed Investment in Structures by Type
- U50505      # Table 5.5.5U. Private Fixed Investment in Equipment by Type
- T50605      # Table 5.6.5. Private Fixed Investment in Intellectual Property Products by Type
- U50705BU1   # Table 5.7.5BU1. Change in Private Inventories by Industry
# U50705BU1 is nonfarm-only. 5.7.5B carries the farm line (B018RC, line 2) and
# the CIPI total (A014RC, line 1) that the F03000 column ties to exactly. Farm is
# roughly -5,679 in 2017 against a 32,674 total - 17% of the column - so a build
# without it is silently wrong. See inventories_estimation_plan.md, section Farm.
- T50705B     # Table 5.7.5B. Change in Private Inventories by Industry (farm/nonfarm)


years:
- 2012
- 2013
- 2014
- 2015
- 2016
- 2017
- 2018
- 2019
- 2020
- 2021
- 2022
- 2023
- 2024
